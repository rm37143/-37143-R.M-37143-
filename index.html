<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - A4.9 INTERACTIVE BOARD</title>
    
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.95); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
        body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 80px; overflow-x: hidden; }
        
        /* Top Status Bar */
        .top-status-bar { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--glass); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 2000; border-bottom: 2px solid var(--pink); }
        .dark-mode .top-status-bar { background: rgba(30, 30, 30, 0.9); }
        .nav-left { display: flex; flex-direction: column; gap: 4px; padding-top: 15px; }
        .nav-btn-sm { background: var(--pink); color: white; border: none; padding: 4px 8px; border-radius: 8px; font-size: 0.6rem; font-weight: bold; cursor: pointer; }
        .status-center-display { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .user-stat { display: flex; flex-direction: column; align-items: center; min-width: 80px; text-align: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-bottom: 2px; }
        .dot-online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .stat-label { font-size: 0.7rem; font-weight: bold; color: var(--dark); }
        .stat-time { font-size: 0.5rem; color: #777; line-height: 1.1; }
        .off-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .off-btn { background: #ff4d4d; color: white; border: none; width: 55px; height: 35px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Container & Cards */
        .container { width: 100%; max-width: 400px; text-align: center; margin-top: 90px; }
        .card { background: white; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #ffd1dc; color:#000; position: relative; }
        
        /* --- STICKY BOARD ON DASHBOARD --- */
        .green-board { 
            background: #1b4d3e; 
            border: 8px solid #5d4037; 
            border-radius: 10px; 
            padding: 15px; 
            margin-top: 20px; 
            min-height: 220px; 
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 5px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            overflow: hidden;
        }

        .board-note-sm {
            width: 85px;
            height: 85px;
            padding: 8px;
            position: relative;
            font-size: 0.65rem;
            overflow: hidden;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            transition: 0.2s;
            background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 100% 10px;
            color: #333;
            text-align: left;
            line-height: 10px;
        }

        .pin-sm {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* --- FULL PAGE VIEW MODAL --- */
        .board-full-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:4000; flex-direction:column; }
        
        .note-page-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .full-page-paper {
            background: #fff;
            width: 100%;
            max-width: 350px;
            min-height: 500px;
            padding: 40px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            background-image: linear-gradient(#e1e1e1 1px, transparent 1px);
            background-size: 100% 28px; /* Grey Notebook Lines */
            line-height: 28px;
            font-family: 'Comic Sans MS', cursive;
            color: #2c3e50;
            font-size: 1rem;
        }

        .page-status-bar {
            position: sticky;
            top: -20px;
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
            margin: -40px -25px 20px -25px;
            padding: 10px 20px;
            font-size: 0.8rem;
            color: #666;
            display: flex;
            justify-content: space-between;
            font-family: sans-serif;
            z-index: 10;
        }

        /* Standard Elements */
        .hub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .hub-btn { background: white; border: 1.5px solid var(--pink); border-radius: 12px; height: 45px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .wa-bottom { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 400px; margin: 0 auto; background: #f0f0f0; padding: 10px 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
        .chat-frame { display: none; position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 380px; height: 380px; background: var(--wa-bg); border-radius: 20px; z-index: 1500; flex-direction: column; padding: 10px; border: 2px solid var(--pink); overflow-y: auto; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; margin-bottom: 5px; }
        .msg-me { align-self: flex-end; background: #dcf8c6; }
        .msg-them { align-self: flex-start; background: #ffffff; }
    </style>
</head>
<body>

<button onclick="toggleTheme()" style="position:fixed; top:8px; left:10px; z-index:3000; background:var(--pink); color:white; border:none; padding:5px 10px; border-radius:8px; font-size:0.65rem;">🌓 MODE</button>

<div class="top-status-bar" id="top-bar-ui" style="display:none;">
    <div class="nav-left"><button class="nav-btn-sm" id="silent-btn" onclick="toggleSilent()">🔕 SILENT</button></div>
    <div class="status-center-display" id="top-status-content"></div>
    <div class="off-group"><button class="off-btn" onclick="fullExit()">OFF</button></div>
</div>

<div class="container">
    <div id="login-screen" class="card">
        <h2 style="color:var(--pink);">Secret Dunia</h2>
        <input type="text" id="u-name" placeholder="User Name" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <input type="password" id="u-pass" placeholder="Enter Key" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;" onkeypress="if(event.key==='Enter') checkAuth()">
        <button id="login-btn" style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="card">
            <div id="countdown-list"></div>
        </div>

        <div class="hub-grid">
            <button class="hub-btn" onclick="openHub(1)">🔗</button>
            <button class="hub-btn" onclick="openHub(2)">🎬</button>
            <button class="hub-btn" onclick="openHub(3)">🎧</button>
            <button class="hub-btn" onclick="openHub(4)">📂</button>
        </div>

        <div class="green-board" id="board-preview" onclick="openFullBoard()">
            </div>
        <div style="margin-top: 10px;">
            <button onclick="showNewNoteForm()" style="background:var(--pink); color:white; border:none; padding:8px 20px; border-radius:20px; font-size:0.8rem; font-weight:bold;">+ ADD NEW NOTE ON BOARD</button>
        </div>
    </div>
</div>

<div id="board-modal" class="board-full-view">
    <div style="padding:15px; background:#1b4d3e; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #5d4037;">
        <h3 style="color:white; margin:0;">Sticky Board</h3>
        <button onclick="closeFullBoard()" style="background:red; color:white; border:none; padding:8px 15px; border-radius:5px;">CLOSE</button>
    </div>
    <div id="board-scroll-container" style="flex:1; overflow-y:auto; background:#1b4d3e; display:flex; flex-wrap:wrap; gap:20px; padding:30px; justify-content:center;">
        </div>
</div>

<div id="full-note-modal" class="board-full-view" style="z-index:5000; background:rgba(0,0,0,0.85);">
    <div class="note-page-container">
        <div class="full-page-paper" id="paper-content">
            <div class="page-status-bar">
                <span id="page-user">From: User</span>
                <span id="page-date">Date: ---</span>
            </div>
            <div id="page-text-body">Note content goes here...</div>
            <div id="page-img-body"></div>
            <button onclick="closeFullPage()" style="margin-top:40px; background:var(--pink); color:white; border:none; padding:10px 25px; border-radius:5px; width:100%;">DONE READING</button>
        </div>
    </div>
</div>

<div id="note-form-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:6000; justify-content:center; align-items:center;">
    <div class="card" style="width:90%; max-width:350px;">
        <h4>Create New Note</h4>
        <textarea id="note-text" placeholder="Write your note here..." style="width:95%; height:100px; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <label style="font-size:0.8rem">Paper Color: <input type="color" id="note-color" value="#fff9c4"></label>
            <label style="font-size:0.8rem">Pin Color: <input type="color" id="pin-color" value="#ff0000"></label>
        </div>
        <input type="text" id="note-pic-url" placeholder="Image URL (Optional)" style="width:95%; margin-bottom:15px; padding:8px; border-radius:5px; border:1px solid #ddd;">
        <div style="display:flex; gap:10px;">
            <button onclick="saveSticky()" id="sticky-save-btn" style="flex:1; background:var(--green); color:white; border:none; padding:12px; border-radius:8px; font-weight:bold;">SAVE</button>
            <button onclick="hideNewNoteForm()" style="flex:1; background:grey; color:white; border:none; padding:12px; border-radius:8px;">CANCEL</button>
        </div>
    </div>
</div>

<div class="chat-frame" id="notes-display"></div>

<div id="wa-bar" class="wa-bottom" style="display:none;">
    <div class="wa-input-box">
        <button onclick="toggleChat()" style="background:none; border:none; font-size:1.4rem;">💬</button>
        <input type="text" id="wa-input" placeholder="Message" onkeydown="if(event.key==='Enter') sendNote()">
    </div>
    <button class="wa-send-btn" onclick="sendNote()">➤</button>
</div>

<script>
    // --- INSERT YOUR SCRIPT URL ---
    const scriptURL = 'https://script.google.com/macros/s/AKfycbweqyKrl_KUxQXkf863Osid8Kylcyxv-y7JdZsTZ5xc72-J9PDSEVfydIBqLU3w0CB2/exec';
    
    let currentUser = "", allStickyData = [];

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        const res = await fetch(scriptURL);
        const data = await res.json();
        if((n.includes("AWAIS") && p == data.passwords.LoginPassAwais) || (n.includes("NISHA") && p == data.passwords.LoginPassNisha)) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            document.getElementById('wa-bar').style.display='flex';
            document.getElementById('top-bar-ui').style.display='flex';
            refreshData();
            setInterval(refreshData, 8000);
        } else { alert("Wrong Key!"); }
    }

    async function refreshData() {
        const res = await fetch(scriptURL);
        const data = await res.json();
        allStickyData = data.board || [];
        renderBoard(allStickyData);
        // Add your other refresh logic (status, history) here if needed
    }

    function renderBoard(stickyData) {
        const preview = document.getElementById('board-preview');
        const container = document.getElementById('board-scroll-container');
        
        let previewHtml = "";
        let fullHtml = "";

        stickyData.slice().reverse().forEach((note, index) => {
            const rotation = (Math.random() * 16 - 8).toFixed(1); // -8 to 8 deg
            const noteColor = note.color || '#fff9c4';
            const pinColor = note.pinColor || 'red';

            // Small Paper for Dashboard
            previewHtml += `
                <div class="board-note-sm" style="background:${noteColor}; transform:rotate(${rotation}deg);">
                    <div class="pin-sm" style="background:${pinColor}"></div>
                    ${note.content.substring(0, 40)}...
                </div>`;

            // Bigger Paper for Interactive Board
            fullHtml += `
                <div class="board-note-sm" onclick="openFullPage('${note.id}')" style="width:130px; height:130px; background:${noteColor}; transform:rotate(${rotation}deg); font-size:0.8rem; line-height:14px; padding:15px; cursor:pointer;">
                    <div class="pin-sm" style="width:10px; height:10px; background:${pinColor}"></div>
                    <span style="position:absolute; top:2px; right:5px; color:red;" onclick="event.stopPropagation(); deleteSticky('${note.id}')">×</span>
                    <strong>${note.user}:</strong><br>
                    ${note.content.substring(0, 60)}...
                </div>`;
        });

        preview.innerHTML = previewHtml || "<div style='color:white; opacity:0.5;'>Board is empty.</div>";
        container.innerHTML = fullHtml;
    }

    function openFullPage(id) {
        const note = allStickyData.find(n => n.id === id);
        if(!note) return;
        document.getElementById('page-user').innerText = "From: " + note.user;
        document.getElementById('page-date').innerText = "Date: " + (note.created || 'N/A');
        document.getElementById('page-text-body').innerText = note.content;
        document.getElementById('page-img-body').innerHTML = note.image ? `<img src="${note.image}" style="width:100%; margin-top:20px; border-radius:5px;">` : "";
        document.getElementById('full-note-modal').style.display = 'flex';
    }

    function closeFullPage() { document.getElementById('full-note-modal').style.display = 'none'; }
    function openFullBoard() { document.getElementById('board-modal').style.display = 'flex'; }
    function closeFullBoard() { document.getElementById('board-modal').style.display = 'none'; }
    function showNewNoteForm() { document.getElementById('note-form-overlay').style.display = 'flex'; }
    function hideNewNoteForm() { document.getElementById('note-form-overlay').style.display = 'none'; }

    async function saveSticky() {
        const text = document.getElementById('note-text').value.trim();
        if(!text) return;
        const btn = document.getElementById('sticky-save-btn');
        btn.innerText = "SAVING..."; btn.disabled = true;

        await fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                action: "addSticky",
                user: currentUser,
                content: text,
                color: document.getElementById('note-color').value,
                pinColor: document.getElementById('pin-color').value,
                image: document.getElementById('note-pic-url').value
            })
        });

        document.getElementById('note-text').value = "";
        hideNewNoteForm();
        btn.innerText = "SAVE"; btn.disabled = false;
        refreshData();
    }

    async function deleteSticky(id) {
        if(confirm("Delete this note?")) {
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: "deleteSticky", id: id}) });
            refreshData();
        }
    }

    function toggleChat() { 
        const box = document.getElementById('notes-display');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
    }
    
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    // Add other functions from your original script as needed (sendNote, etc.)
</script>
</body>
</html>
