<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - A4.3 LOCKED</title>
    
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.95); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
        body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 80px; overflow-x: hidden; }
        
        /* TOP NAV */
        .top-status-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 75px;
            background: var(--glass); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; z-index: 2000; border-bottom: 2px solid var(--pink);
        }
        .dark-mode .top-status-bar { background: rgba(30, 30, 30, 0.9); }
        .nav-left { display: flex; flex-direction: column; gap: 4px; }
        .nav-btn-sm { background: var(--pink); color: white; border: none; padding: 5px 8px; border-radius: 8px; font-size: 0.6rem; font-weight: bold; cursor: pointer; }

        /* STATUS CENTER */
        .status-center-display { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .user-stat { display: flex; flex-direction: column; align-items: center; min-width: 70px; text-align: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-bottom: 2px; }
        .dot-online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .stat-label { font-size: 0.7rem; font-weight: bold; color: var(--dark); }
        .stat-time { font-size: 0.5rem; color: #777; line-height: 1.1; }
        .dark-mode .stat-label { color: white; }
        .private-tag { color: var(--pink); font-size: 0.6rem; font-weight: bold; }

        /* OFF BUTTON GROUP */
        .off-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .off-btn { background: #ff4d4d; color: white; border: none; width: 55px; height: 40px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .stay-label { font-size: 0.5rem; color: var(--dark); display: flex; align-items: center; }
        .dark-mode .stay-label { color: white; }

        /* CHAT UI UNCHANGED */
        .chat-frame { display: none; position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 380px; height: 400px; background: var(--wa-bg); border-radius: 20px; z-index: 1500; flex-direction: column; padding: 10px; border: 2px solid var(--pink); overflow-y: auto; gap: 8px; box-sizing: border-box; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); color: #000; }
        .msg-me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg-them { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.6rem; opacity: 0.5; margin-top: 5px; display: block; text-align: right; }
        .msg-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; font-weight: bold; display: none; border: 1px solid white;}
        
        .container { width: 100%; max-width: 400px; text-align: center; margin-top: 90px; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 10px; border: 1px solid #ffd1dc; color: #444; }
        .dark-mode .card { background: #222; color: white; border-color: #444; }
        .wa-bottom { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 400px; margin: 0 auto; background: #f0f0f0; padding: 10px 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
        .wa-input-box { flex: 1; background: white; border-radius: 25px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; }
        .wa-input-box input { flex: 1; border: none; outline: none; padding: 8px 0; font-size: 0.95rem; }
        .wa-send-btn { background: #075e54; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; }
        .private-lock { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
    </style>
</head>
<body>

<button onclick="toggleTheme()" id="fixed-mode" style="position:fixed; top:10px; left:10px; z-index:3000; background:var(--pink); color:white; border:none; padding:6px; border-radius:8px; font-size:0.6rem;">🌓 MODE</button>

<div class="top-status-bar" id="top-bar-ui" style="display:none;">
    <div class="nav-left">
        <div style="height:25px;"></div> <button class="nav-btn-sm" id="silent-btn" onclick="toggleSilent()">🔕 SILENT</button>
    </div>
    
    <div class="status-center-display" id="top-status-content"></div>

    <div class="off-group">
        <button class="off-btn" onclick="fullExit()">OFF</button>
        <label class="stay-label"><input type="checkbox" id="stay-login"> Stay</label>
    </div>
</div>

<div class="container">
    <div id="login-screen" class="card">
        <h2 style="color:var(--pink); margin-top:20px;">Secret Dunia</h2>
        <input type="text" id="u-name" placeholder="User Name" style="width:80%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <input type="password" id="u-pass" placeholder="Enter Key" style="width:80%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <div style="margin:10px 0; font-size:0.8rem;">
            <input type="checkbox" id="private-mode"> 🕵️ Private Mode
        </div>
        <button style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%; cursor:pointer;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="card" id="countdown-area"></div>
        <div class="card" id="playlist-area"></div>
        <button onclick="addCountdownPrompt()" style="background:var(--pink); color:white; border:none; padding:10px 20px; border-radius:15px; font-weight:bold; cursor:pointer;">+ Event</button>
    </div>
</div>

<div class="chat-frame" id="notes-display"></div>

<div id="wa-bar" class="wa-bottom" style="display:none;">
    <div class="wa-input-box" id="wa-input-wrapper">
        <div style="position:relative; display:inline-block;">
            <button onclick="toggleChat()" style="background:none; border:none; font-size:1.4rem;">💬</button>
            <span id="notif-badge" class="msg-badge">0</span>
        </div>
        <input type="text" id="wa-input" placeholder="Message" onkeydown="if(event.key==='Enter') sendNote()">
    </div>
    <button class="wa-send-btn" id="wa-send-btn-main" onclick="sendNote()">➤</button>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyHiSHbpv31Nf6og15QmOx6CzDlKWaMElofDgqxeJaK6PbMLLIfUM0J_fXZ_i71q551/exec';
    let currentUser = "", lastMsgCount = 0, isSilent = true, isPrivate = false, lastActivity = Date.now();
    let localHistory = [], myLastSeen = -1;

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        isPrivate = document.getElementById('private-mode').checked;
        
        const res = await fetch(scriptURL);
        const data = await res.json();
        
        if((n.includes("AWAIS") && p == data.passwords.LoginPassAwais) || (n.includes("NISHA") && p == data.passwords.LoginPassNisha)) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            document.getElementById('wa-bar').style.display='flex';
            document.getElementById('top-bar-ui').style.display='flex';

            if(isPrivate) {
                document.getElementById('wa-input-wrapper').classList.add('private-lock');
                document.getElementById('wa-send-btn-main').classList.add('private-lock');
            }

            await refreshData(); 
            if(!isPrivate) updateStatus("Online", myLastSeen);
            
            setInterval(refreshData, 5000); 
            setInterval(checkIdle, 60000); // Check idle every minute
        } else { alert("Wrong Key!"); }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            let otherSeen = 0, topHtml = ""; 
            
            data.onlineUsers.forEach(u => {
                let isMe = u.name.toUpperCase().includes(currentUser);
                if(!isMe) otherSeen = parseInt(u.seenCount) || 0;
                else if(myLastSeen === -1) myLastSeen = parseInt(u.seenCount) || 0;
                
                // Logic: 10 Min Auto Offline check
                let lastUpdate = new Date(u.time.replace(' ', 'T')).getTime();
                let diffMins = (Date.now() - lastUpdate) / 60000;
                let isOnline = (u.status === "Online" && diffMins < 10);
                
                let nameInit = u.name.toUpperCase().includes("AWAIS") ? "A" : "N";
                let statusText = isOnline ? "Online" : "Offline";
                
                // Private User sees themselves as Private, others see them as Offline
                let displayStatus = statusText;
                if(isMe && isPrivate) displayStatus = "🕵️ Private";
                if(!isMe && u.status === "Private") displayStatus = "Offline";

                topHtml += `<div class="user-stat">
                                <div class="dot ${isOnline && displayStatus!=='Offline'?'dot-online':''}"></div>
                                <span class="stat-label">${nameInit}: ${displayStatus}</span>
                                <span class="stat-time">${displayStatus === "Offline" ? formatFullDate(u.time) : 'Active Now'}</span>
                            </div>`;
            });
            document.getElementById('top-status-content').innerHTML = topHtml;

            localHistory = data.history || [];
            if(localHistory.length > lastMsgCount) {
                let unreadCount = localHistory.length - myLastSeen;
                if(unreadCount > 0 && localHistory.slice(myLastSeen).some(m => !m.name.toUpperCase().includes(currentUser))) {
                    if(lastMsgCount !== 0 && !isSilent) document.getElementById('notif-sound').play();
                    document.getElementById('notif-badge').innerText = unreadCount;
                    document.getElementById('notif-badge').style.display = 'block';
                }
                lastMsgCount = localHistory.length;
            }
            if(!isPrivate) renderMessages(otherSeen);
        } catch(e) { }
    }

    function formatFullDate(s) {
        if(!s) return "";
        let d = new Date(s.replace(' ', 'T'));
        let days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        let months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        let hrs = d.getHours()%12||12;
        let ampm = d.getHours()>=12?'pm':'am';
        return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}<br>${hrs}:${String(d.getMinutes()).padStart(2,'0')}${ampm}`;
    }

    function checkIdle() {
        if(document.getElementById('stay-login').checked) return;
        if(Date.now() - lastActivity > 600000) { // 10 Minutes
            fullExit();
        }
    }

    function updateStatus(s, count) { 
        if(isPrivate && s === "Online") return; 
        fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s, seenCount:count})}); 
    }

    function toggleChat() {
        if(isPrivate) { alert("Private User restricted."); return; }
        const box = document.getElementById('notes-display');
        const isOpen = box.style.display === 'flex';
        box.style.display = isOpen ? 'none' : 'flex';
        if(!isOpen) {
            box.scrollTop = box.scrollHeight;
            document.getElementById('notif-badge').style.display = 'none';
            myLastSeen = localHistory.length;
            updateStatus("Online", myLastSeen);
        }
    }

    function fullExit() {
        if(!isPrivate) updateStatus("Offline", myLastSeen);
        document.body.innerHTML = "<div style='display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column;'><h2>World Closed.</h2><button onclick='location.reload()'>Re-Login</button></div>";
    }

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function toggleSilent() { isSilent = !isSilent; document.getElementById('silent-btn').innerHTML = isSilent ? "🔕 SILENT" : "🔔 SOUND"; }
    
    // Activity Tracker
    window.onload = window.onmousemove = window.onmousedown = window.ontouchstart = window.onclick = window.onkeypress = () => { lastActivity = Date.now(); };

    // Placeholder functions for original logic
    function renderMessages(otherSeen) { /* Same as A4.2 */ }
    function sendNote() { if(!isPrivate) { /* Same as A4.2 */ } }
</script>
</body>
</html>
