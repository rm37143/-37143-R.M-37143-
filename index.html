<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - A3 Locked</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.9); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; }
        body.dark-mode { background: #1a1a1a; }
        .dark-mode .card { background: rgba(45, 45, 45, 0.9); border: 1px solid #444; color: white; }
        .dark-mode .status-bar { background: #333; color: #ddd; }
        .dark-mode textarea { color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        .container { width: 100%; max-width: 400px; text-align: center; position: relative; }
        
        .mode-toggle, #silent-btn { position: fixed; top: 10px; z-index: 1000; background: var(--pink); color: white; border: none; padding: 6px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; cursor: pointer; width: 85px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .mode-toggle { left: 10px; }
        #silent-btn { right: 10px; }

        .main-title { color: var(--pink); margin: 35px 0 5px 0; font-size: 1.6rem; font-weight: bold; }
        .nisha-note { color: #d63384; font-size: 0.7rem; font-style: italic; margin-bottom: 12px; display: block; opacity: 0.8; }
        
        .countdown-container { background: white; border-radius: 15px; padding: 12px; margin-bottom: 10px; border: 1px solid #ffd1dc; text-align: left; }
        .cd-row { margin-bottom: 10px; border-bottom: 1px solid #fff5f7; padding-bottom: 5px; position: relative; display: flex; justify-content: space-between; align-items: center; }
        .cd-info { flex-grow: 1; }
        .cd-label { color: #d63384; font-size: 0.95rem; font-weight: bold; display: block; }
        .cd-time { color: #555; font-size: 0.7rem; display: block; margin-top: 2px; }
        .cd-user { font-size: 0.55rem; color: #bdc3c7; font-style: italic; display: block; margin-top: 2px; }
        .del-ev-btn { background: #fff0f3; border: 1px solid #ffd1dc; color: #ff85a2; cursor: pointer; font-size: 0.8rem; font-weight: bold; padding: 2px 8px; border-radius: 8px; margin-left: 10px; }

        .btn-add-event { background: var(--pink); color: white; border: none; padding: 8px 18px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 0.8rem; margin-bottom: 15px; }

        .card { background: var(--glass); border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; border: 1px solid white; position: relative; }
        
        .status-bar { background: #fff; padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 0.62rem; border-left: 5px solid var(--green); text-align: left; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #f9f9f9; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-online { background: var(--green); box-shadow: 0 0 5px var(--green); }
        .dot-offline { background: var(--grey); }
        .off-btn { background:#ff4d4d; color:white; border:none; border-radius:6px; padding:2px 8px; font-size:0.6rem; cursor:pointer; }
        
        .history-box { height: 320px; overflow-y: auto; text-align: left; padding: 5px; }
        .note-item { margin-bottom: 10px; padding: 10px 15px; border-radius: 18px; position: relative; max-width: 85%; line-height: 1.4; font-size: 0.9rem; clear: both; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .note-awais { background-color: #ffe0e9 !important; border-bottom-right-radius: 2px; float: right; color: #000; } 
        .note-nisha { background-color: #e3f2fd !important; border-bottom-left-radius: 2px; float: left; color: #000; }
        .note-meta { font-size: 0.55rem; color: #777; margin-top: 4px; display: block; text-align: right; }
        
        textarea { width: 100%; border: none; background: transparent; padding: 8px 5px; resize: none; outline: none; font-size: 0.95rem; min-height: 20px; max-height: 80px; overflow-y: auto; text-align: center; }
        .btn-main { background: var(--pink); color: white; border: none; padding: 12px; border-radius: 20px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .hub-btn { background: #fff0f3; border: 1px solid #ffd1dc; padding: 10px 4px; border-radius: 12px; cursor: pointer; font-size: 0.65rem; font-weight: bold; color: #d63384; }
        
        #dashboard { display: none; }
        input { width: 85%; padding: 12px; margin: 8px 0; border-radius: 20px; border: 1px solid #eee; text-align: center; outline: none; }
    </style>
</head>
<body>

<button class="mode-toggle" onclick="toggleTheme()" 🌓 MODE</button>
<button id="silent-btn" onclick="toggleSilent()" 🔕 SILENT</button>

<div class="container">
    <h2 class="main-title">Secret Dunia</h2>
    
    <div id="login-screen" class="card">
        <input type="text" id="u-name" placeholder="User Name">
        <input type="password" id="u-pass" placeholder="Enter Key" onkeypress="if(event.key === 'Enter') checkAuth()">
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0; font-size: 0.8rem; color: #666;">
            <input type="checkbox" id="is-private" style="width: 16px; margin: 0;"> <span>Private Mode</span>
        </div>
        <button class="btn-main" id="login-btn" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard">
        <span class="nisha-note">N sb Apna Wada Yaad Rakhna Hai Hamesha.</span>
        
        <div class="countdown-container" id="countdown-area"></div>
        <button class="btn-add-event" onclick="addCountdownPrompt()">+ Add Event</button>

        <div class="status-bar" id="status-container">Syncing Status...</div>
        
        <div class="card" style="padding: 10px;">
            <textarea id="note-input" placeholder="Type message & press Enter..." rows="1" onkeydown="handleMsgInput(event)" oninput="this.style.height='auto'; this.style.height=(this.scrollHeight)+'px';"></textarea>
        </div>

        <div class="card" style="padding: 10px;">
            <div id="unread-badge" style="font-size:0.65rem; color:var(--pink); font-weight:bold; margin-bottom: 5px;">Checking...</div>
            <button id="unlock-btn" class="btn-main" style="background:var(--dark);" onclick="unlockHistory()">Unlock Messages 🔒</button>
            <div id="history-area" style="display:none;">
                <div class="history-box" id="notes-display"></div>
            </div>
        </div>

        <div class="card" style="padding: 10px;"><div class="btn-grid" id="hub-grid"></div></div>
    </div>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxJJzjOnEQQB4k7lg5UxUq2Nys5Dbv3J-G56LYEKCeJmetlPJPj7Ir9_80rvKnKWWhj/exec';
    
    let currentUser = "", isPrivateMode = false, isUnlocked = false, sheetPass = {}, lastMsgCount = 0, isSilent = true, savedCountdowns = [], myLastSeen = -1;

    function formatSimpleDate(dateStr) {
        if(!dateStr) return "";
        const d = new Date(dateStr);
        if(isNaN(d)) return dateStr;
        const options = { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true };
        return d.toLocaleString('en-GB', options).replace(',', '');
    }

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function toggleSilent() { isSilent = !isSilent; document.getElementById('silent-btn').innerHTML = isSilent ?  🔕 SILENT" :  🔔 SOUND"; }

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        const btn = document.getElementById('login-btn');
        isPrivateMode = document.getElementById('is-private').checked;

        if(!n || !p) { alert("Please enter name and key!"); return; }
        btn.innerText = "Connecting...";
        btn.disabled = true;

        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            sheetPass = data.passwords;
            if((n.includes("AWAIS") && p == sheetPass.LoginPassAwais) || (n.includes("NISHA") && p == sheetPass.LoginPassNisha)) {
                currentUser = n;
                document.getElementById('login-screen').style.display='none';
                document.getElementById('dashboard').style.display='block';
                updateStatus("Online", -1);
                setInterval(refreshData, 5000);
                setInterval(updateLiveCountdowns, 1000);
            } else { 
                alert("Wrong Password!"); btn.innerText = "Enter World"; btn.disabled = false;
            }
        } catch (e) { alert("Connection Error!"); btn.innerText = "Enter World"; btn.disabled = false; }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            sheetPass = data.passwords;
            savedCountdowns = data.countdowns || [];
            
            let sHtml = ""; let otherSeen = 0, otherName = "";
            data.onlineUsers.forEach(u => {
                let isMe = u.name.toUpperCase().includes(currentUser);
                if(!isMe) { otherSeen = u.seenCount; otherName = u.name; }
                let dotClass = u.status === "Online" ? "dot-online" : "dot-offline";
                let cleanTime = formatSimpleDate(u.time);
                sHtml += `<div class="user-row"><span><span class="dot ${dotClass}"></span><b>${u.name}</b>: ${u.status}</span><span><small>${cleanTime}</small> ${isMe ? `<button class="off-btn" onclick="logout()">OFF</button>` : ''}</span></div>`;
            });
            document.getElementById('status-container').innerHTML = sHtml;

            let history = data.history || [];
            if(history.length > lastMsgCount) {
                if(!isSilent && lastMsgCount !== 0 && !history[history.length-1].name.toUpperCase().includes(currentUser)) {
                    document.getElementById('notif-sound').play();
                }
                lastMsgCount = history.length;
            }

            let badge = document.getElementById('unread-badge');
            if(history.length > 0) {
                let lastMsg = history[history.length-1];
                if(String(lastMsg.name).toUpperCase().includes(currentUser)) {
                    badge.innerHTML = (otherSeen >= history.length) ? `✅ ${otherName} Seen` : `⏳ Sent`;
                } else {
                    badge.innerHTML = (history.length > myLastSeen) ?  💌 New Message` : `✅ All Read`;
                }
            }

            if(isUnlocked) {
                let hHtml = ""; history.slice().reverse().forEach(h => {
                    let side = String(h.name).toUpperCase().includes("AWAIS") ? "note-awais" : "note-nisha";
                    let msgTime = formatSimpleDate(h.time);
                    let cleanNote = typeof h.note === 'object' ? JSON.stringify(h.note) : String(h.note);
                    hHtml += `<div class="note-item ${side}"><div>${cleanNote}</div><span class="note-meta">${h.name} • ${msgTime}</span></div>`;
                });
                document.getElementById('notes-display').innerHTML = hHtml;
                if(history.length > myLastSeen) { myLastSeen = history.length; updateStatus("Online", history.length); }
            }

            let bHtml = ""; 
            ["Ai Assistant", "WhatsApp Hub", "Chat Room 1", "Chat Room 2", "Protected Text", "Video Room", "Pinterest", "Mega Storage"].forEach(name => {
                bHtml += `<div class="hub-btn" onclick="enterRoom('${name}')">${name}</div>`;
            });
            document.getElementById('hub-grid').innerHTML = bHtml;
        } catch(e) {}
    }

    function handleMsgInput(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendNote();
        }
    }

    function updateLiveCountdowns() {
        let html = "";
        savedCountdowns.forEach((c) => {
            let diff = new Date(c.date).getTime() - new Date().getTime();
            let timeText = diff > 0 ? Math.floor(diff/(1000*60*60*24))+"d "+Math.floor((diff%(1000*60*60*24))/(1000*60*60))+"h "+Math.floor((diff%(1000*60*60))/(1000*60))+"m" : "Finished!";
            html += `<div class="cd-row"><div class="cd-info"><span class="cd-label">${c.label}</span><span class="cd-time">${timeText}</span><span class="cd-user">by ${c.user || 'Unknown'}</span></div><button class="del-ev-btn" onclick="removeEvent('${c.label}', '${c.date}', '${c.user}')">x</button></div>`;
        });
        document.getElementById('countdown-area').innerHTML = html;
    }

    async function removeEvent(label, date, creator) {
        if(creator && creator !== "Unknown" && !currentUser.includes(creator.toUpperCase())) {
            alert("Sirf " + creator + " hi ise khatam kar sakte hain!"); return;
        }
        if(confirm("Delete?")) {
            await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"removeCountdown", label:label, date:date})});
            setTimeout(refreshData, 1000);
        }
    }

    function logout() { updateStatus("Offline", myLastSeen); setTimeout(() => { location.reload(); }, 500); }
    function updateStatus(s, count) { fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s, seenCount:count})}); }
    
    async function sendNote() { 
        let input = document.getElementById('note-input');
        let m = input.value.trim(); 
        if(!m || isPrivateMode) return;
        input.value = "";
        input.style.height = "auto";
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:m})}); 
        setTimeout(refreshData, 1000);
    }

    function addCountdownPrompt() { 
        let l = prompt("Name:"); let d = prompt("Date (YYYY-MM-DD HH:MM):"); 
        if(l && d) fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addCountdown", date:d, label:l, user:currentUser})}); 
    }

    function enterRoom(r) { if(prompt("Hub Key:") == sheetPass.HubPass) alert("Redirecting..."); }
    function unlockHistory() { if(prompt("History Key:") == sheetPass.HistoryPass) { isUnlocked = true; document.getElementById('unlock-btn').style.display='none'; document.getElementById('history-area').style.display='block'; refreshData(); } }
</script>
</body>
</html>
