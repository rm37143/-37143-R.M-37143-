<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - A4 Locked</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.9); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
        body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; }
        .dark-mode .card, .dark-mode .music-card { background: rgba(45, 45, 45, 0.9); border: 1px solid #444; color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 70px; overflow-x: hidden; }
        .container { width: 100%; max-width: 400px; text-align: center; position: relative; }
        .mode-toggle, #silent-btn { position: fixed; top: 10px; z-index: 1000; background: var(--pink); color: white; border: none; padding: 6px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; cursor: pointer; width: 85px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .mode-toggle { left: 10px; } #silent-btn { right: 10px; }
        .main-title { color: var(--pink); margin: 35px 0 5px 0; font-size: 1.6rem; font-weight: bold; }
        .nisha-note { color: #d63384; font-size: 0.7rem; font-style: italic; margin-bottom: 12px; display: block; opacity: 0.8; }
        .music-card, .countdown-container { background: white; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #ffd1dc; text-align: left; }
        .card { background: var(--glass); border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; border: 1px solid white; position: relative; }
        .status-bar { background: #fff; padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 0.62rem; border-left: 5px solid var(--green); text-align: left; }
        .chat-frame { display: none; position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 380px; height: 420px; background: var(--wa-bg); border-radius: 20px 20px 5px 5px; z-index: 1500; flex-direction: column; padding: 10px; border: 2px solid var(--pink); box-shadow: 0 -5px 15px rgba(0,0,0,0.1); overflow-y: auto; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); line-height: 1.4; text-align: left;}
        .msg-me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg-them { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; }
        .wa-bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 400px; background: #f0f0f0; padding: 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
        .wa-input-box { flex: 1; background: white; border-radius: 25px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; position: relative; }
        .wa-input-box input { flex: 1; border: none; outline: none; padding: 8px 0; font-size: 0.95rem; }
        .wa-send-btn { background: #075e54; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #dashboard { display: none; }
        .auth-input { width: 85%; padding: 12px; margin: 8px 0; border-radius: 20px; border: 1px solid #eee; text-align: center; outline: none; }
        .msg-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 0.6rem; min-width: 15px; height: 15px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 1px solid white; }
    </style>
</head>
<body>

<button class="mode-toggle" onclick="toggleTheme()">🌓 MODE</button>
<button id="silent-btn" onclick="toggleSilent()">🔕 SILENT</button>

<div class="container">
    <h2 class="main-title">Secret Dunia</h2>
    <div id="login-screen" class="card">
        <input type="text" id="u-name" class="auth-input" placeholder="User Name">
        <input type="password" id="u-pass" class="auth-input" placeholder="Enter Key">
        <button id="login-btn" style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard">
        <span class="nisha-note">N sb Apna Wada Yaad Rakhna Hai Hamesha.</span>
        <div class="music-card"><b>🎵 Smart Playlist</b><div id="playlist-area"></div></div>
        <div class="countdown-container" id="countdown-area"></div>
        <div class="status-bar" id="status-container">Syncing...</div>
        <div class="card"><div id="hub-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"></div></div>
    </div>
</div>

<div class="chat-frame" id="notes-display"></div>

<div id="wa-bar" class="wa-bottom" style="display:none;">
    <div class="wa-input-box">
        <div style="position:relative;">
            <button onclick="toggleChat()" style="background:none; border:none; font-size:1.4rem;">💬</button>
            <div id="badge-count" class="msg-badge">0</div>
        </div>
        <input type="text" id="wa-input" placeholder="Message" onkeydown="if(event.key==='Enter') sendNote()">
    </div>
    <button class="wa-send-btn" onclick="sendNote()">➤</button>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwHUVzgp2yQj0Odfw4iHitjO3wDqFrNJmLkG18_c4TUCghSo8iaAQewK3CNhe7l1PS_/exec';
    let currentUser = "", lastMsgCount = 0;

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        document.getElementById('login-btn').innerText = "Verifying...";
        try {
            const res = await fetch(`${scriptURL}?action=login&user=${n}&pass=${p}`);
            if (await res.text() === "true") { currentUser = n; startDashboard(); }
            else { alert("Wrong Key!"); document.getElementById('login-btn').innerText = "Enter World"; }
        } catch(e) { alert("Error!"); }
    }

    function startDashboard() {
        document.getElementById('login-screen').style.display='none';
        document.getElementById('dashboard').style.display='block';
        document.getElementById('wa-bar').style.display='flex';
        refreshData(); setInterval(refreshData, 5000);
    }

    function toggleChat() {
        const box = document.getElementById('notes-display');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        if(box.style.display === 'flex') box.scrollTop = box.scrollHeight;
    }

    async function refreshData() {
        try {
            const res = await fetch(`${scriptURL}?action=getData`);
            const data = await res.json();
            let hHtml = "";
            data.history.forEach(h => {
                let isMe = h.name.toUpperCase().includes(currentUser);
                hHtml += `<div class="msg ${isMe ? 'msg-me':'msg-them'}"><b>${h.name}:</b><br>${h.note}</div>`;
            });
            document.getElementById('notes-display').innerHTML = hHtml;
            if(data.history.length > lastMsgCount) {
                lastMsgCount = data.history.length;
                document.getElementById('notes-display').scrollTop = document.getElementById('notes-display').scrollHeight;
            }
        } catch(e) { console.log("Sync error"); }
    }

    async function sendNote() {
        let i = document.getElementById('wa-input');
        let m = i.value.trim(); if(!m) return;
        i.value = "";
        await fetch(scriptURL, {method:'POST', body:JSON.stringify({name:currentUser, note:m})});
        refreshData();
    }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
</script>
</body>
</html>
