<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - R.M. Pro</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.9); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; }
        body.dark-mode { background: #1a1a1a; }
        .dark-mode .card { background: rgba(45, 45, 45, 0.9); border: 1px solid #444; color: white; }
        .dark-mode .status-bar { background: #333; color: #ddd; }
        .dark-mode textarea { color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        .container { width: 100%; max-width: 400px; text-align: center; position: relative; }
        
        /* Layout Controls */
        .top-controls { position: fixed; top: 10px; width: 100%; max-width: 400px; display: flex; justify-content: space-between; z-index: 1000; padding: 0 10px; pointer-events: none; }
        .top-controls button { pointer-events: auto; background: var(--pink); color: white; border: none; padding: 6px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; opacity: 0.9; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .main-title { color: var(--pink); margin: 30px 0 5px 0; font-size: 1.6rem; font-weight: bold; }
        .nisha-note { color: #d63384; font-size: 0.7rem; font-style: italic; margin-bottom: 12px; display: block; opacity: 0.8; }
        
        .card { background: var(--glass); border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; border: 1px solid white; position: relative; }
        
        /* Countdown Style */
        .countdown-section { font-size: 0.65rem; color: #d63384; margin-bottom: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .cd-item { background: #fff; padding: 4px 8px; border-radius: 10px; border: 1px solid #ffd1dc; }

        .status-bar { background: #fff; padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 0.62rem; border-left: 5px solid var(--green); text-align: left; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-online { background: var(--green); box-shadow: 0 0 5px var(--green); }
        .dot-offline { background: var(--grey); }

        /* Message Box */
        .input-wrapper { display: flex; align-items: center; gap: 5px; }
        textarea { flex: 1; border: none; background: transparent; padding: 5px; resize: none; outline: none; font-size: 0.9rem; min-height: 35px; }
        .attach-btn { color: var(--pink); font-size: 1.2rem; cursor: pointer; padding: 0 5px; }

        /* History & Reactions */
        .history-box { height: 350px; overflow-y: auto; text-align: left; }
        .note-item { margin-bottom: 8px; padding: 8px 12px; border-radius: 15px; position: relative; }
        .note-awais { background: #ffe0e9; border-left: 4px solid var(--pink); margin-right: 20px; }
        .note-nisha { background: #e3f2fd; border-left: 4px solid #2196f3; margin-left: 20px; }
        .react-bar { display: flex; gap: 8px; margin-top: 5px; font-size: 0.8rem; }
        .react-btn { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .react-btn:hover { opacity: 1; transform: scale(1.2); }
        .active-react { font-size: 0.8rem; background: white; padding: 2px 5px; border-radius: 8px; margin-top: 3px; display: inline-block; }

        .btn-main { background: var(--pink); color: white; border: none; padding: 10px; border-radius: 20px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .hub-btn { background: #fff0f3; border: 1px solid #ffd1dc; padding: 10px 4px; border-radius: 12px; cursor: pointer; font-size: 0.65rem; font-weight: bold; color: #d63384; }
        
        #dashboard { display: none; }
        input[type="text"], input[type="password"] { width: 85%; padding: 10px; margin: 8px 0; border-radius: 20px; border: 1px solid #eee; text-align: center; }
    </style>
</head>
<body onmousedown="resetActivityTimer()">

<div class="top-controls">
    <button onclick="toggleTheme()">🌓 MODE</button>
    <button id="silent-btn" onclick="toggleSilent()">🔔 SOUND</button>
</div>

<div class="container">
    <h2 class="main-title">Secret Dunia</h2>
    
    <div id="login-screen" class="card">
        <h3 style="color:var(--pink)">Welcome</h3>
        <input type="text" id="u-name" placeholder="User Name">
        <input type="password" id="u-pass" placeholder="Enter Key">
        <div style="font-size:0.75rem; margin-bottom:10px;">
            <input type="checkbox" id="is-private"> Private Mode
        </div>
        <button class="btn-main" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard">
        <span class="nisha-note">Nisha ye sub ap k Liye banaya...</span>
        
        <div id="countdown-area" class="countdown-section"></div>
        <button onclick="addCountdownPrompt()" style="font-size:0.5rem; background:none; border:none; color:var(--pink); cursor:pointer;">+ Add Event</button>

        <div class="status-bar" id="status-container">Syncing...</div>
        
        <div class="card" style="padding: 10px;">
            <div class="input-wrapper">
                <span class="attach-btn" onclick="shareFile()">📎</span>
                <textarea id="note-input" placeholder="Write a Message..." onkeypress="if(event.key==='Enter') sendNote()"></textarea>
                <span class="attach-btn" onclick="sendNote()">🚀</span>
            </div>
        </div>

        <div class="card">
            <div id="unread-badge" style="font-size:0.6rem; color:var(--pink); margin-bottom:5px;">Checking...</div>
            <button id="unlock-btn" class="btn-main" style="background:#444;" onclick="unlockHistory()">Unlock Messages 🔒</button>
            <div id="history-area" style="display:none;">
                <div class="history-box" id="notes-display"></div>
            </div>
        </div>

        <div class="card"><div class="btn-grid" id="hub-grid"></div></div>
        
        <div id="friendship-tag" style="font-size:0.7rem; color:#888; margin-top:10px;">Friendship: ...</div>
    </div>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzgh3nJIYWFUGn9EZ0i5gFLvYGsMhAjnA58Y37ebt6Ut88H9fyMubiT1ZVahsBAKooz/exec';
    
    let currentUser = "", isPrivateMode = false, isUnlocked = false, isSilent = false;
    let sheetPass = {}, myLastSeen = -1, lastMsgCount = 0;

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function toggleSilent() { 
        isSilent = !isSilent; 
        document.getElementById('silent-btn').innerHTML = isSilent ? "🔕 SILENT" : "🔔 SOUND";
    }

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        isPrivateMode = document.getElementById('is-private').checked;

        const res = await fetch(scriptURL);
        const data = await res.json();
        sheetPass = data.passwords;

        if((n.includes("AWAIS") && p == sheetPass.LoginPassAwais) || (n.includes("NISHA") && p == sheetPass.LoginPassNisha)) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            updateStatus("Online", -1);
            refreshData();
            setInterval(refreshData, 5000);
            updateFriendship();
        } else { alert("Wrong Password!"); }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            sheetPass = data.passwords;
            
            // 1. Update Status & Offline Fix
            let sHtml = "";
            data.onlineUsers.forEach(u => {
                let isMe = u.name.toUpperCase().includes(currentUser);
                if(isMe) { myLastSeen = u.seenCount; updateStatus("Online", myLastSeen); }
                let dotClass = u.status === "Online" ? "dot-online" : "dot-offline";
                sHtml += `<div class="user-row"><span><span class="dot ${dotClass}"></span>${u.name}: ${u.status}</span><small>${u.time}</small></div>`;
            });
            document.getElementById('status-container').innerHTML = sHtml;

            // 2. Countdowns
            let cHtml = "";
            data.countdowns.forEach(c => {
                let diff = new Date(c.date) - new Date();
                let days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                cHtml += `<div class="cd-item">${c.label}: <b>${days > 0 ? days + 'd' : 'Today!'}</b></div>`;
            });
            document.getElementById('countdown-area').innerHTML = cHtml;

            // 3. History & Reactions
            let history = data.history || [];
            if(history.length > lastMsgCount) {
                if(!isSilent && lastMsgCount !== 0 && !history[history.length-1].name.toUpperCase().includes(currentUser)) {
                    document.getElementById('notif-sound').play();
                }
                lastMsgCount = history.length;
            }

            if(isUnlocked) {
                let hHtml = "";
                history.slice().reverse().forEach(h => {
                    let side = h.name.toUpperCase().includes("AWAIS") ? "note-awais" : "note-nisha";
                    hHtml += `
                    <div class="note-item ${side}">
                        <div>${h.note}</div>
                        <div style="font-size:0.5rem; opacity:0.6">${h.time}</div>
                        ${h.reaction ? `<div class="active-react">${h.reaction}</div>` : ''}
                        <div class="react-bar">
                            <span class="react-btn" onclick="addReaction('${h.name}','${h.note}','❤️')">❤️</span>
                            <span class="react-btn" onclick="addReaction('${h.name}','${h.note}','😂')">😂</span>
                            <span class="react-btn" onclick="addReaction('${h.name}','${h.note}','👍')">👍</span>
                        </div>
                    </div>`;
                });
                document.getElementById('notes-display').innerHTML = hHtml;
            }
        } catch(e) { console.log("Refresh Error"); }
    }

    function updateStatus(s, count) {
        fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s, isPrivateMode:isPrivateMode, seenCount:count})});
    }

    async function sendNote() {
        const msg = document.getElementById('note-input').value.trim();
        if(!msg || isPrivateMode) return;
        document.getElementById('note-input').value = "";
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:msg})});
        refreshData();
    }

    async function addReaction(user, note, emoji) {
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addReaction", msgUser:user, msgNote:note, reaction:emoji})});
        refreshData();
    }

    function shareFile() {
        let url = prompt("Paste Photo/File Link:");
        if(url) { document.getElementById('note-input').value = "📎 File: " + url; sendNote(); }
    }

    function addCountdownPrompt() {
        let label = prompt("Event Name (e.g. Birthday):");
        let date = prompt("Date (YYYY-MM-DD):");
        if(label && date) {
            fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addCountdown", date:date, label:label})});
            setTimeout(refreshData, 2000);
        }
    }

    function unlockHistory() {
        let p = prompt("Enter Key:");
        if(p == sheetPass.HistoryPass) {
            isUnlocked = true;
            document.getElementById('unlock-btn').style.display = 'none';
            document.getElementById('history-area').style.display = 'block';
            refreshData();
        }
    }

    function updateFriendship() { document.getElementById('friendship-tag').innerHTML = `Friendship: ${new Date().getFullYear() - 2015} Years`; }
    function resetActivityTimer() { /* Reset logic if needed */ }
</script>
</body>
</html>
