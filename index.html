<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Secret Dunia - DC12 A5</title>
<style>
/* ==========================================
   MODULE 4: DESIGN (COMPLETE STYLES)
   ========================================== */
:root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.95); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; color: white; }
body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 80px; overflow-x: hidden; }

/* Nickname Selection */
.nick-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
.nick-btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #eee; background: white; font-size: 1.5rem; font-weight: bold; color: var(--pink); cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.nick-btn.selected { border-color: var(--pink); background: #fff0f3; transform: scale(1.1); box-shadow: 0 0 15px rgba(255, 133, 162, 0.3); }

/* Top Bar & Status */
.top-status-bar { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--glass); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 2000; border-bottom: 2px solid var(--pink); }
.nav-btn-sm { background: var(--pink); color: white; border: none; padding: 4px 8px; border-radius: 8px; font-size: 0.6rem; font-weight: bold; cursor: pointer; }
.status-center-display { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; }
.user-stat { display: flex; flex-direction: column; align-items: center; min-width: 80px; text-align: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-bottom: 2px; }
.dot-online { background: var(--green); box-shadow: 0 0 8px var(--green); }
.stat-label { font-size: 0.7rem; font-weight: bold; color: var(--dark); }
.off-btn { background: #ff4d4d; color: white; border: none; width: 55px; height: 35px; border-radius: 8px; font-weight: bold; cursor: pointer; }

/* Chat & Messages */
.chat-frame { display: none; position: fixed; top: 75px; bottom: 65px; left: 0; right: 0; width: 100%; background: var(--wa-bg); z-index: 1500; flex-direction: column; padding: 10px; overflow-y: auto; gap: 8px; box-sizing: border-box; scroll-behavior: smooth; }
.msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); line-height: 1.4; color: #000; word-wrap: break-word; }
.msg-me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
.msg-them { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; }
.msg-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; display: none; }

/* Dashboard & Hub */
.container { width: 100%; max-width: 400px; text-align: center; margin-top: 90px; }
.card { background: white; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #ffd1dc; color:#000; }
.hub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
.hub-btn { background: var(--pink); color: white; border: none; border-radius: 8px; height: 38px; font-size: 0.65rem; font-weight: bold; cursor: pointer; }
.green-board { background: #1b4d3e; border: 8px solid #5d4037; border-radius: 5px; padding: 10px; margin-top: 20px; height: 160px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
.mini-note { width: 70px; height: 75px; padding: 4px; font-size: 0.45rem; background: #fff9c4; border-radius: 2px; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }

/* Bottom Bar */
.wa-bottom { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 400px; margin: 0 auto; background: #f0f0f0; padding: 10px 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
.wa-input-box { flex: 1; background: white; border-radius: 25px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; }
.wa-send-btn { background: #075e54; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; }
</style>
</head>

<body>
<button onclick="toggleTheme()" style="position:fixed; top:8px; left:10px; z-index:3000; background:var(--pink); color:white; border:none; padding:5px 10px; border-radius:8px; font-size:0.65rem;">🌓 MODE</button>

<div class="top-status-bar" id="top-bar-ui" style="display:none;">
    <div class="nav-left"><button class="nav-btn-sm" id="silent-btn" onclick="toggleSilent()">🔕 SILENT</button></div>
    <div class="status-center-display" id="top-status-content"></div>
    <div class="off-group"><button class="off-btn" onclick="fullExit()">OFF</button></div>
</div>

<div class="container">
    <div id="login-screen" class="card">
        <h2 style="color:var(--pink);">Secret Dunia A5</h2>
        <div class="nick-container">
            <button id="btn-nick-a" class="nick-btn" onclick="selectUser('A', 'AWAIS')">A</button>
            <button id="btn-nick-n" class="nick-btn" onclick="selectUser('N', 'NISHA')">N</button>
        </div>
        <input type="hidden" id="u-name">
        <input type="password" id="u-pass" placeholder="Enter Key" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <button id="login-btn" style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:0.8rem; font-weight:bold; color:var(--pink);">⏳ Upcoming Events</span>
                <button onclick="addNewEvent()" style="background:var(--pink); color:white; border:none; border-radius:5px; font-size:0.6rem; padding:3px 8px;">+ ADD</button>
            </div>
            <div id="countdown-list" style="max-height: 100px; overflow-y: auto;"></div>
        </div>

        <div class="hub-grid">
            <button class="hub-btn" onclick="openHub(1)">Hack.Chat</button>
            <button class="hub-btn" onclick="openHub(2)">Protected</button>
            <button class="hub-btn" onclick="openHub(3)">Storage</button>
            <button class="hub-btn" onclick="openHub(4)">Mega</button>
            <button class="hub-btn" onclick="openHub(5)">Safe</button>
            <button class="hub-btn" onclick="openHub(6)">Pics</button>
            <button class="hub-btn" onclick="openHub(7)">Maps</button>
            <button class="hub-btn" style="background:red;" onclick="openHub(8)">🎥 REELS</button>
        </div>

        <div class="green-board" id="board-preview" onclick="openFullBoard()"></div>
    </div>
</div>

<div class="chat-frame" id="notes-display"></div>

<div id="wa-bar" class="wa-bottom" style="display:none;">
    <div class="wa-input-box">
        <div style="position:relative;"><button onclick="toggleChat()" style="background:none; border:none; font-size:1.4rem;">💬</button><span id="notif-badge" class="msg-badge">0</span></div>
        <input type="text" id="wa-input" placeholder="Message" style="border:none; outline:none; flex:1;">
    </div>
    <button class="wa-send-btn" onclick="sendNote()">➤</button>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

<script>
/* ==========================================
   MODULE 3: LOGIC (FAST A5 SYNC)
   ========================================== */
const scriptURL = 'https://script.google.com/macros/s/AKfycbwZx7X113scaw-WugpMhhMDKxGNxPFxuX-6cfIjmUx2rSWS1l1lCL8cw-iT49GewnKK/exec';
let currentUser="", lastMsgCount=0, isSilent=true;

function selectUser(nick, realName) {
    document.querySelectorAll('.nick-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById(nick === 'A' ? 'btn-nick-a' : 'btn-nick-n').classList.add('selected');
    document.getElementById('u-name').value = realName;
}

// FAST LOGIN LOGIC
async function checkAuth(){
    const btn=document.getElementById('login-btn');
    const n=document.getElementById('u-name').value;
    const p=document.getElementById('u-pass').value.trim();
    if(!n){alert("Select A or N!"); return;}
    btn.innerText="Connecting...";

    try {
        const res = await fetch(scriptURL);
        const data = await res.json();
        if((n==="AWAIS" && p == data.passwords.LoginPassAwais) || (n==="NISHA" && p == data.passwords.LoginPassNisha)) {
            // INSTANT SWITCH
            currentUser = n;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('wa-bar').style.display = 'flex';
            document.getElementById('top-bar-ui').style.display = 'flex';
            
            // Background Tasks
            refreshData(); 
            setInterval(refreshData, 5000);
            updateStatus("Online");
        } else { alert("Wrong Key!"); btn.innerText="Enter World"; }
    } catch(e) { alert("Error!"); btn.innerText="Enter World"; }
}

async function refreshData(){
    try {
        const res = await fetch(scriptURL);
        const data = await res.json();
        
        // Render Status Fast
        let stHtml = "";
        data.onlineUsers.forEach(u => {
            let init = u.name.toUpperCase().includes("AWAIS") ? "A" : "N";
            stHtml += `<div class="user-stat"><div class="dot ${u.status==='Online'?'dot-online':''}"></div><span class="stat-label">${init}: ${u.status}</span></div>`;
        });
        document.getElementById('top-status-content').innerHTML = stHtml;

        // Render History
        let chatHtml = "";
        data.history.forEach(m => {
            let isMe = m.name.toUpperCase() === currentUser;
            chatHtml += `<div class="msg ${isMe?'msg-me':'msg-them'}">${m.note}</div>`;
        });
        document.getElementById('notes-display').innerHTML = chatHtml;

        // Render Board Mini
        let brdHtml = "";
        data.board.reverse().slice(0,6).forEach(n => {
            brdHtml += `<div class="mini-note"><b>${n.user}:</b> ${n.content.substring(0,15)}</div>`;
        });
        document.getElementById('board-preview').innerHTML = brdHtml || "Board Empty";
    } catch(e) { console.log("Refresh Error"); }
}

function toggleChat(){
    const c = document.getElementById('notes-display');
    c.style.display = (c.style.display==='flex') ? 'none' : 'flex';
    if(c.style.display==='flex') c.scrollTop = c.scrollHeight;
}

function sendNote(){
    let i=document.getElementById('wa-input'), m=i.value.trim();
    if(!m) return;
    fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:m})});
    i.value="";
}

function updateStatus(s){ fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s})}); }
function toggleTheme(){ document.body.classList.toggle('dark-mode'); }
function fullExit(){ updateStatus("Offline"); window.location.href="about:blank"; }
function openHub(id){ /* Add Hub Logic */ alert("Opening Hub " + id); }
</script>
</body>
</html>
