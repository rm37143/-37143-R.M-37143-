<style>
    /* NEW: Countdown Specific Styles (Safe for A4) */
    .event-scroll-area { 
        max-height: 150px; 
        overflow-y: auto; 
        margin-top: 5px; 
        display: flex; 
        flex-direction: column; 
        gap: 6px; 
        padding: 5px;
    }
    .event-bar { 
        background: white; 
        border-radius: 10px; 
        padding: 8px 12px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-left: 4px solid var(--pink);
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .dark-mode .event-bar { background: #2c2c2c; color: white; }
    .event-details { text-align: left; flex: 1; }
    .ev-name { font-size: 0.75rem; font-weight: bold; color: var(--pink); margin: 0; }
    .ev-timer { font-size: 0.8rem; font-family: monospace; font-weight: bold; color: #555; }
    .dark-mode .ev-timer { color: #ccc; }
    .ev-user { font-size: 0.55rem; color: #999; text-transform: uppercase; }
    .ev-close { background: none; border: none; color: #ff4d4d; font-size: 1.2rem; cursor: pointer; padding: 0 5px; line-height: 1; }
    
    .add-ev-btn { 
        background: var(--pink); 
        color: white; 
        border: none; 
        padding: 5px 12px; 
        border-radius: 15px; 
        font-size: 0.65rem; 
        font-weight: bold; 
        margin-top: 8px; 
        cursor: pointer;
    }
</style>

<div class="container">
    <div id="login-screen" class="card">
        <h2 style="color:var(--pink);">Secret Dunia</h2>
        <input type="text" id="u-name" placeholder="User Name" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <input type="password" id="u-pass" placeholder="Enter Key" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;" onkeypress="if(event.key==='Enter') checkAuth()">
        <div style="margin:10px 0; font-size:0.8rem;"><input type="checkbox" id="private-mode"> 🕵️ Private Mode</div>
        <button style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard" style="display:none;">
        <span class="nisha-note" style="color:#d63384; font-size:0.7rem; font-style:italic;">N sb Apna Wada Yaad Rakhna Hai Hamesha.</span>
        
        <div id="event-root">
            <div class="event-scroll-area" id="event-list-container"></div>
            <button class="add-ev-btn" onclick="openEventPrompt()">+ ADD EVENT</button>
        </div>

        <div class="card" id="countdown-area" style="font-size:0.75rem; margin-top:10px; display:none;"></div>
    </div>
</div>

<script>
    // ... [Previous Variables Locked] ...
    let countdownData = []; 

    // MODIFIED: refreshData to include Countdowns
    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            // 1. LOCKED STATUS LOGIC
            let topHtml = ""; 
            data.onlineUsers.forEach(u => {
                let isMe = u.name.toUpperCase().includes(currentUser);
                if(!isMe) otherSeenCountGlobal = parseInt(u.seenCount) || 0;
                else if(myLastSeen === -1) myLastSeen = parseInt(u.seenCount) || 0;
                let lastUpdate = parseSafeDate(u.time).getTime();
                let isOnline = (u.status === "Online" && (Date.now() - lastUpdate) < 600000);
                let nameInit = u.name.toUpperCase().includes("AWAIS") ? "A" : "N";
                let displayStatus = isOnline ? "Online" : "Offline";
                if(isMe && isPrivate) displayStatus = "🕵️ Private";
                topHtml += `<div class="user-stat">
                                <div class="dot ${isOnline && displayStatus!=='Offline'?'dot-online':''}"></div>
                                <span class="stat-label">${nameInit}: ${displayStatus}</span>
                                <span class="stat-time">${displayStatus === "Offline" ? formatFullDate(u.time) : 'Active Now'}</span>
                            </div>`;
            });
            document.getElementById('top-status-content').innerHTML = topHtml;

            // 2. LOCKED CHAT LOGIC
            const chatBox = document.getElementById('notes-display');
            const badge = document.getElementById('notif-badge');
            if(data.history.length > lastMsgCount) {
                localHistory = data.history;
                let unreadCount = localHistory.length - myLastSeen;
                if(unreadCount > 0 && chatBox.style.display !== 'flex') {
                    badge.innerText = unreadCount; badge.style.display = 'block';
                    if(lastMsgCount !== 0 && !isSilent) document.getElementById('notif-sound').play();
                }
                lastMsgCount = localHistory.length;
                renderMessages(otherSeenCountGlobal);
            }

            // 3. NEW: COUNTDOWN LOGIC
            countdownData = data.countdowns || [];
            renderEventBars();

        } catch(e) { }
    }

    // NEW: Function to render Event Bars
    function renderEventBars() {
        const container = document.getElementById('event-list-container');
        let html = "";
        const now = Date.now();

        countdownData.forEach((ev, idx) => {
            const targetDate = new Date(ev.date).getTime();
            const diff = targetDate - now;

            // Auto-remove after 6 hours (21600000 ms)
            if (diff < -21600000) return;

            const isOwner = ev.user.toUpperCase().includes(currentUser);
            
            html += `
                <div class="event-bar">
                    <div class="event-details">
                        <p class="ev-name">${ev.label}</p>
                        <div class="ev-timer" id="timer-text-${idx}">${formatTimeDiff(diff)}</div>
                        <span class="ev-user">Added by: ${ev.user[0]}</span>
                    </div>
                    ${isOwner ? `<button class="ev-close" onclick="removeEvent(${idx})">×</button>` : ''}
                </div>`;
        });
        container.innerHTML = html;
        // Hide container if no events
        container.style.display = html === "" ? "none" : "flex";
    }

    function formatTimeDiff(ms) {
        if (ms < 0) return "EVENT STARTED!";
        const d = Math.floor(ms / 86400000);
        const h = Math.floor((ms % 86400000) / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return `${d}d ${h}h ${m}m ${s}s`;
    }

    // NEW: Add Event Interaction
    async function openEventPrompt() {
        const label = prompt("Event Name (e.g. Birthday):");
        if (!label) return;
        const dateStr = prompt("Enter Date & Time (YYYY-MM-DD HH:MM):", "2026-01-30 18:00");
        if (!dateStr) return;

        await fetch(scriptURL, {
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({action: "addCountdown", label: label, date: dateStr, user: currentUser})
        });
        refreshData();
    }

    // NEW: Remove Event (Sends request to backend)
    function removeEvent(idx) {
        if(confirm("Khatam kar dein ye event?")) {
            // Because backend logic for specific row deletion is complex, 
            // for now we trigger the existing "addCountdown" with a special flag 
            // or you can manually delete from Sheet. 
            // Better: I'll show it as 'removed' locally until you clear the sheet.
            alert("Please remove Row " + (idx + 2) + " from 'Countdowns' sheet manually for now.");
        }
    }

    // Timer Update every second
    setInterval(() => {
        countdownData.forEach((ev, idx) => {
            const el = document.getElementById(`timer-text-${idx}`);
            if (el) {
                const diff = new Date(ev.date).getTime() - Date.now();
                el.innerText = formatTimeDiff(diff);
            }
        });
    }, 1000);

    // ... [Rest of your locked script] ...
</script>
