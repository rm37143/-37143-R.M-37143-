<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - R.M.</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.9); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; }
        body.dark-mode { background: #1a1a1a; }
        .dark-mode .card { background: rgba(45, 45, 45, 0.9); border: 1px solid #444; color: white; }
        .dark-mode .status-bar { background: #333; color: #ddd; }
        .dark-mode textarea { color: white; }
        .dark-mode .hub-btn { background: #3d3d3d; border-color: #555; color: var(--pink); }
        .note-item div { color: #000 !important; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        .container { width: 100%; max-width: 400px; text-align: center; position: relative; }
        .mode-toggle { position: fixed; top: 10px; left: 10px; z-index: 1000; background: var(--pink); color: white; border: none; padding: 6px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; cursor: pointer; opacity: 0.8; }
        #silent-btn { position: fixed; top: 10px; right: 10px; z-index: 1000; background: var(--dark); color: white; border: none; padding: 6px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; cursor: pointer; opacity: 0.8; }
        .main-title { color: var(--pink); margin: 5px 0; font-size: 1.6rem; font-weight: bold; }
        .nisha-note { color: #d63384; font-size: 0.7rem; font-style: italic; margin-bottom: 12px; display: block; opacity: 0.8; }
        .card { background: var(--glass); border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; border: 1px solid white; position: relative; }
        .status-bar { background: #fff; padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 0.62rem; border-left: 5px solid var(--green); text-align: left; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #f9f9f9; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-online { background: var(--green); box-shadow: 0 0 5px var(--green); }
        .dot-offline { background: var(--grey); }
        .off-btn { background:#ff4d4d; color:white; border:none; border-radius:6px; padding:2px 8px; font-size:0.6rem; cursor:pointer; }
        textarea { width: 80%; border: none; background: transparent; padding: 5px; resize: none; outline: none; font-size: 0.95rem; color: #333; min-height: 35px; height: 35px; }
        .history-box { height: 320px; overflow-y: auto; text-align: left; padding: 5px; }
        .msg-counter { font-size: 0.65rem; font-weight: bold; color: var(--pink); margin-bottom: 4px; display: block; }
        .note-item { margin-bottom: 6px; padding: 6px 10px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.03); min-height: fit-content; position: relative; }
        .note-awais { background-color: #ffe0e9 !important; border-left: 4px solid var(--pink); } 
        .note-nisha { background-color: #e3f2fd !important; border-left: 4px solid #2196f3; }
        .note-meta { font-size: 0.52rem; color: #777; margin-top: 1px; display: block; }
        .btn-main { background: var(--pink); color: white; border: none; padding: 10px; border-radius: 20px; font-weight: bold; width: 100%; cursor: pointer; font-size: 0.85rem; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .hub-btn { background: #fff0f3; border: 1px solid #ffd1dc; padding: 10px 4px; border-radius: 12px; cursor: pointer; font-size: 0.65rem; font-weight: bold; color: #d63384; position: relative; }
        .close-btn { position: absolute; top: 5px; right: 10px; background: #eee; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 0.6rem; z-index: 10; color: #000; }
        input { width: 85%; padding: 10px; margin: 8px 0; border-radius: 20px; border: 1px solid #eee; text-align: center; outline: none; }
        .friendship-tag { font-size: 0.65rem; color: #888; margin-top: 15px; font-weight: bold; border-top: 1px solid #ffd1dc; padding-top: 8px; }
        .signature-line { font-size: 0.6rem; color: #555; margin-top: 5px; font-style: italic; }
        #dashboard { display: none; }
        .countdown-row { font-size: 0.6rem; color: var(--pink); display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
        .react-badge { font-size: 0.7rem; background: white; border-radius: 5px; padding: 1px 3px; position: absolute; bottom: 2px; right: 5px; }
    </style>
</head>
<body onmousedown="resetInactivityTimer()" onkeydown="resetInactivityTimer()">

<button class="mode-toggle" onclick="toggleTheme()">LIGHT/DARK</button>
<button id="silent-btn" onclick="toggleSilent()">🔔 SOUND</button>

<div class="container">
    <h2 class="main-title">Secret Dunia</h2>
    
    <div id="login-screen" class="card">
        <span style="color:var(--pink); font-weight:bold; font-size:1.1rem;">Welcome</span>
        <input type="text" id="u-name" placeholder="User Name">
        <input type="password" id="u-pass" placeholder="Enter Key">
        <div style="font-size:0.75rem; color:#888; margin-bottom:12px;">
            <input type="checkbox" id="is-private" style="width:14px;"> <span>Private Mode</span>
        </div>
        <button class="btn-main" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard">
        <span class="nisha-note">Nisha ye sub ap k Liye banaya or ye ap k Liye hi rahy ga hamesha.</span>
        
        <div id="countdown-area" class="countdown-row"></div>
        <button onclick="addCountdownPrompt()" style="font-size:0.5rem; background:none; border:none; color:#888; cursor:pointer;">+ Event</button>

        <div class="status-bar" id="status-container">Syncing...</div>
        
        <div class="card" style="padding: 10px; display: flex; align-items: center;">
            <span onclick="shareFile()" style="cursor:pointer; padding: 0 5px;">📎</span>
            <textarea id="note-input" placeholder="Write a Message..." onfocus="checkPrivateStatus()" onkeypress="if(event.key==='Enter') sendNote()"></textarea>
            <span onclick="sendNote()" style="cursor:pointer; color: var(--pink); font-weight: bold;">🚀</span>
        </div>

        <div class="card" style="padding: 10px;">
            <div id="unread-badge" class="msg-counter">Checking...</div>
            <button id="unlock-btn" class="btn-main" style="background:var(--dark);" onclick="unlockHistory()">Unlock Messages 🔒</button>
            <div id="history-area" style="display:none;">
                <button class="close-btn" onclick="closeHistory()">X</button>
                <div class="history-box" id="notes-display"></div>
            </div>
        </div>

        <div class="card" style="padding: 10px;"><div class="btn-grid" id="hub-grid"></div></div>
        
        <div class="friendship-tag" id="friendship-tag">Friendship: Loading...</div>
        <div class="signature-line">Signature: Awais by R.M.</div>
    </div>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzgh3nJIYWFUGn9EZ0i5gFLvYGsMhAjnA58Y37ebt6Ut88H9fyMubiT1ZVahsBAKooz/exec';
    
    // Purane Yaadgar Buttons
    const hubButtons = [
        { name: "Ai Assistant", link: "https://gemini.google.com/app", pass: "HubPass" },
        { name: "WhatsApp Hub", link: "https://wa.me/923059763620", pass: "HubPass" },
        { name: "Chat Room 1", link: "https://hack.chat/?r.m.", pass: "HubPass" },
        { name: "Chat Room 2", link: "https://hack.chat/?r.m.37143", pass: "HubPass" },
        { name: "Protected Text", link: "https://www.protectedtext.com/r.m.", pass: "HubPass" },
        { name: "Video Room", link: "#", pass: "HubPass" },
        { name: "Pinterest", link: "https://pin.it/2ltHmjbrB", pass: "HubPass" },
        { name: "Mega Storage", link: "https://mega.nz/login", pass: "HubPass" },
        { name: "PC Storage", link: "https://drive.google.com/drive/folders/1yHexmY0ha8D0oFJcFVRO3IXc2GgI-ZX5?usp=drive_link", pass: "HubPass" }
    ];

    let currentUser = "", isPrivateMode = false, isUnlocked = false, inactivityTimer, totalMessages = 0, myLastSeen = -1, sheetPass = {}, lastMsgCount = 0, isSilent = false;

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function toggleSilent() { isSilent = !isSilent; document.getElementById('silent-btn').innerHTML = isSilent ? "🔕 SILENT" : "🔔 SOUND"; }
    function updateFriendship() { document.getElementById('friendship-tag').innerHTML = `Friendship: ${new Date().getFullYear() - 2015} Years`; }
    function resetInactivityTimer() { clearTimeout(inactivityTimer); if(currentUser) inactivityTimer = setTimeout(() => { location.reload(); }, 600000); }

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        isPrivateMode = document.getElementById('is-private').checked;
        const res = await fetch(scriptURL);
        const data = await res.json();
        sheetPass = data.passwords;

        if(n && ((n.includes("AWAIS") && p == sheetPass.LoginPassAwais) || (n.includes("NISHA") && p == sheetPass.LoginPassNisha))) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            updateStatus("Online", -1);
            await refreshData();
            updateFriendship(); 
            setInterval(refreshData, 5000);
        } else { alert("Wrong Password!"); }
    }

    function checkPrivateStatus() { if(isPrivateMode) { alert("Not allowed in Private Mode!"); document.getElementById('note-input').blur(); } }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            sheetPass = data.passwords;
            
            // Online Users & OFF Button
            let sHtml = ""; let otherSeen = 0, otherName = "";
            data.onlineUsers.forEach(u => {
                let nameUpper = u.name.toUpperCase();
                let isMe = nameUpper.includes(currentUser);
                if(!isMe) { otherSeen = u.seenCount; otherName = u.name; }
                else { if(myLastSeen === -1) myLastSeen = u.seenCount; updateStatus("Online", myLastSeen); }
                
                let dotClass = u.status === "Online" ? "dot-online" : "dot-offline";
                sHtml += `<div class="user-row"><span><span class="dot ${dotClass}"></span><b>${u.name}</b>: ${u.status}</span><span><small>${u.time}</small> ${isMe ? `<button class="off-btn" onclick="location.reload()">OFF</button>` : ''}</span></div>`;
            });
            document.getElementById('status-container').innerHTML = sHtml;

            // Countdowns
            let cHtml = "";
            data.countdowns.forEach(c => {
                let diff = new Date(c.date) - new Date();
                let days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                cHtml += `<span>[${c.label}: ${days > 0 ? days+'d' : 'Today'}]</span>`;
            });
            document.getElementById('countdown-area').innerHTML = cHtml;

            // Unread Logic & Sound
            let history = data.history || [];
            totalMessages = history.length;
            if(totalMessages > lastMsgCount) {
                if(!isSilent && lastMsgCount !== 0 && !history[totalMessages-1].name.toUpperCase().includes(currentUser)) {
                    document.getElementById('notif-sound').play();
                }
                lastMsgCount = totalMessages;
            }

            let badge = document.getElementById('unread-badge');
            if(totalMessages > 0) {
                let lastMsg = history[totalMessages - 1];
                if(lastMsg.name.toUpperCase().includes(currentUser)) {
                    badge.innerHTML = (otherSeen >= totalMessages) ? `✅ ${otherName} Seen` : `⏳ Sent`;
                } else {
                    badge.innerHTML = (totalMessages > myLastSeen) ? `💌 New Message` : `✅ All Read`;
                }
            }

            // History & Reactions
            if(isUnlocked) {
                if(totalMessages > myLastSeen) { myLastSeen = totalMessages; updateStatus("Online", totalMessages); }
                let hHtml = ""; 
                history.slice().reverse().forEach(h => {
                    let side = h.name.toUpperCase().includes("AWAIS") ? "note-awais" : "note-nisha";
                    hHtml += `<div class="note-item ${side}" onclick="reactPrompt('${h.name}','${h.note}')"><div>${h.note}</div><span class="note-meta">${h.name} • ${h.time}</span>${h.reaction ? `<span class="react-badge">${h.reaction}</span>` : ''}</div>`;
                });
                document.getElementById('notes-display').innerHTML = hHtml;
            }

            // Hub Buttons
            let bHtml = "";
            hubButtons.forEach(btn => { bHtml += `<div class="hub-btn" onclick="enterRoom('${btn.name}')">${btn.name}</div>`; });
            document.getElementById('hub-grid').innerHTML = bHtml;

        } catch(e) { console.log("Refresh Error"); }
    }

    function updateStatus(s, count) { fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s, isPrivateMode:isPrivateMode, seenCount:count})}); }

    async function sendNote() {
        const msg = document.getElementById('note-input').value.trim();
        if(!msg || isPrivateMode) return;
        document.getElementById('note-input').value = "";
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:msg})});
        refreshData();
    }

    function reactPrompt(user, note) {
        let r = prompt("React: 1=❤️, 2=😂, 3=👍");
        let emoji = r=="1" ? "❤️" : r=="2" ? "😂" : r=="3" ? "👍" : "";
        if(emoji) fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addReaction", msgUser:user, msgNote:note, reaction:emoji})}).then(()=>refreshData());
    }

    function shareFile() { let url = prompt("Paste Link:"); if(url) { document.getElementById('note-input').value = "📎 " + url; sendNote(); } }
    function addCountdownPrompt() { let l = prompt("Label:"); let d = prompt("Date (YYYY-MM-DD):"); if(l && d) fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addCountdown", date:d, label:l})}); }
    function enterRoom(rN) { const b = hubButtons.find(x => x.name === rN); let p = prompt("Pass:"); if (p == sheetPass.HubPass) window.location.href = b.link; }
    function unlockHistory() { let p = prompt("Key:"); if (p == sheetPass.HistoryPass) { isUnlocked = true; document.getElementById('unlock-btn').style.display = 'none'; document.getElementById('history-area').style.display = 'block'; refreshData(); } }
    function closeHistory() { isUnlocked = false; document.getElementById('history-area').style.display = 'none'; document.getElementById('unlock-btn').style.display = 'block'; }
</script>
</body>
</html>
