<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - A4 Fixed</title>
    
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.9); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
        body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; }
        .dark-mode .card, .dark-mode .music-card { background: rgba(45, 45, 45, 0.9); border: 1px solid #444; color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 70px; overflow-x: hidden; }
        .container { width: 100%; max-width: 400px; text-align: center; position: relative; }
        
        /* Buttons */
        .mode-toggle, #silent-btn { position: fixed; top: 10px; z-index: 1000; background: var(--pink); color: white; border: none; padding: 6px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; cursor: pointer; width: 85px; }
        .mode-toggle { left: 10px; }
        #silent-btn { right: 10px; }
        
        .main-title { color: var(--pink); margin: 35px 0 5px 0; font-size: 1.6rem; font-weight: bold; }
        
        /* Chat Frame */
        .chat-frame { 
            display: none; position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 380px; height: 400px; background: var(--wa-bg); 
            border-radius: 20px 20px 5px 5px; z-index: 1500; flex-direction: column; 
            padding: 10px; border: 2px solid var(--pink); box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            overflow-y: auto; gap: 8px;
        }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); line-height: 1.4; margin-bottom: 4px; }
        .msg-me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; text-align: right; }
        .msg-them { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; text-align: left; }
        .msg-time { font-size: 0.6rem; opacity: 0.5; margin-top: 4px; display: block; }
        .tick-blue { color: #34b7f1; font-weight: bold; margin-left: 3px; }
        .date-divider { align-self: center; background: #d1e4f3; color: #555; padding: 3px 10px; border-radius: 8px; font-size: 0.65rem; margin: 10px 0; font-weight: bold; width: fit-content; }

        /* Badge */
        .badge-container { position: relative; display: inline-block; }
        #notif-badge { 
            position: absolute; top: -5px; right: -5px; background: red; color: white; 
            font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; font-weight: bold; 
            display: none; min-width: 12px; text-align: center; border: 1px solid white;
        }

        .card { background: var(--glass); border-radius: 20px; padding: 15px; margin-bottom: 10px; border: 1px solid white; }
        .status-bar { background: #fff; padding: 10px; border-radius: 12px; font-size: 0.62rem; border-left: 5px solid var(--green); text-align: left; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #f9f9f9; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-online { background: var(--green); }
        .dot-offline { background: var(--grey); }

        .wa-bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 400px; background: #f0f0f0; padding: 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
        .wa-input-box { flex: 1; background: white; border-radius: 25px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; }
        .wa-input-box input { flex: 1; border: none; outline: none; padding: 8px 0; font-size: 0.95rem; }
        .wa-send-btn { background: #075e54; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; font-size: 1.2rem; cursor: pointer; }

        .music-card, .countdown-container { background: white; border-radius: 15px; padding: 10px; margin-bottom: 10px; text-align: left; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .hub-btn { background: #fff0f3; border: 1px solid #ffd1dc; padding: 10px; border-radius: 12px; cursor: pointer; font-size: 0.65rem; font-weight: bold; color: #d63384; text-align: center; }
        #dashboard { display: none; }
        .auth-input { width: 85%; padding: 12px; margin: 8px 0; border-radius: 20px; border: 1px solid #eee; text-align: center; }
    </style>
</head>
<body>

<button class="mode-toggle" onclick="toggleTheme()">🌓 MODE</button>
<button id="silent-btn" onclick="toggleSilent()">🔕 SILENT</button>

<div class="container">
    <h2 class="main-title">Secret Dunia</h2>
    
    <div id="login-screen" class="card">
        <input type="text" id="u-name" class="auth-input" placeholder="User Name">
        <input type="password" id="u-pass" class="auth-input" placeholder="Enter Key" onkeypress="if(event.key === 'Enter') checkAuth()">
        <button style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%; cursor:pointer;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard">
        <span class="nisha-note">N sb Apna Wada Yaad Rakhna Hai Hamesha.</span>
        
        <div class="music-card">
            <b style="color: var(--blue); font-size: 0.8rem;">🎵 Smart Playlist</b>
            <div id="playlist-area" style="max-height: 80px; overflow-y: auto;"></div>
            <div id="smart-player" style="display:none; margin-top:5px;">
                <button onclick="togglePlay()">⏯</button> <span id="now-playing-title" style="font-size:0.7rem;"></span>
            </div>
            <audio id="global-audio"></audio>
        </div>

        <div class="countdown-container" id="countdown-area"></div>
        <div class="status-bar" id="status-container">Syncing...</div>
        <div class="card" style="padding: 10px;"><div class="btn-grid" id="hub-grid"></div></div>
    </div>
</div>

<div class="chat-frame" id="notes-display"></div>

<div id="wa-bar" class="wa-bottom" style="display:none;">
    <div class="wa-input-box">
        <div class="badge-container">
            <button onclick="toggleChat()" style="background:none; border:none; font-size:1.4rem; cursor:pointer;">💬</button>
            <span id="notif-badge">0</span>
        </div>
        <input type="text" id="wa-input" placeholder="Message" onkeydown="if(event.key==='Enter') sendNote()">
    </div>
    <button class="wa-send-btn" onclick="sendNote()">➤</button>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwWmEBB9f9r4bmQKulIF7Vv1sjtGTfmCJLMTHjd3bZ2NKTxfhAfKnoq3ETYoU4ZbiK4/exec';
    let currentUser = "", lastMsgCount = 0, isSilent = true, lastDateShown = "";

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        const res = await fetch(scriptURL);
        const data = await res.json();
        if((n.includes("AWAIS") && p == data.passwords.LoginPassAwais) || (n.includes("NISHA") && p == data.passwords.LoginPassNisha)) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            document.getElementById('wa-bar').style.display='flex';
            setInterval(refreshData, 3000);
        } else { alert("Wrong Key!"); }
    }

    function toggleChat() {
        const box = document.getElementById('notes-display');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        if(box.style.display === 'flex') {
            box.scrollTop = box.scrollHeight;
            document.getElementById('notif-badge').style.display = 'none';
            document.getElementById('notif-badge').innerText = "0";
        }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            // Status Logic
            let otherSeen = 0;
            let sHtml = "";
            data.onlineUsers.forEach(u => {
                let isMe = u.name.toUpperCase().includes(currentUser);
                if(!isMe) otherSeen = parseInt(u.seenCount) || 0;
                let dot = u.status === "Online" ? "dot-online" : "dot-offline";
                sHtml += `<div class="user-row"><span><span class="dot ${dot}"></span><b>${u.name}</b></span><span><small>${u.status}</small></span></div>`;
            });
            document.getElementById('status-container').innerHTML = sHtml;

            // Chat Logic
            let hHtml = ""; lastDateShown = "";
            let history = data.history || [];
            
            // Badge Notification
            if(history.length > lastMsgCount) {
                if(lastMsgCount !== 0 && !history[history.length-1].name.toUpperCase().includes(currentUser)) {
                    if(!isSilent) document.getElementById('notif-sound').play();
                    if(document.getElementById('notes-display').style.display !== 'flex') {
                        let b = document.getElementById('notif-badge');
                        b.innerText = parseInt(b.innerText) + (history.length - lastMsgCount);
                        b.style.display = 'block';
                    }
                }
                lastMsgCount = history.length;
            }

            history.forEach((h, idx) => {
                // Simple Date handling to avoid "Invalid Date"
                let dateObj = new Date(h.time);
                if(isNaN(dateObj)) dateObj = new Date(); 
                
                let dStr = dateObj.toLocaleDateString();
                if(dStr !== lastDateShown) {
                    hHtml += `<div class="date-divider">${dStr}</div>`;
                    lastDateShown = dStr;
                }

                let isMe = h.name.toUpperCase().includes(currentUser);
                let tick = (isMe && otherSeen > idx) ? '<span class="tick-blue">✓✓</span>' : (isMe ? '✓' : '');
                let content = h.note.startsWith("MEDIA:") ? `<img src="${h.note.split('MEDIA:')[1]}" style="width:100%;">` : h.note;
                
                hHtml += `<div class="msg ${isMe ? 'msg-me' : 'msg-them'}">
                    ${content}
                    <div class="msg-time">${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2,'0')} ${tick}</div>
                </div>`;
            });

            const box = document.getElementById('notes-display');
            box.innerHTML = hHtml;
            if(box.style.display === 'flex') {
                box.scrollTop = box.scrollHeight;
                updateStatus("Online", history.length);
            }

            // Hub Buttons
            let bHtml = ""; ["Ai Assistant", "WhatsApp Hub", "Pinterest", "Settings"].forEach(name => {
                bHtml += `<div class="hub-btn">${name}</div>`;
            });
            document.getElementById('hub-grid').innerHTML = bHtml;

        } catch(e) { console.log("Error:", e); }
    }

    async function sendNote() { 
        let input = document.getElementById('wa-input');
        let m = input.value.trim(); if(!m) return;
        input.value = "";
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:m})}); 
    }

    function updateStatus(s, count) { fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s, seenCount:count})}); }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function toggleSilent() { isSilent = !isSilent; document.getElementById('silent-btn').innerHTML = isSilent ? "🔕 SILENT" : "🔔 SOUND"; }
</script>
</body>
</html>
