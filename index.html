<style>
    :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.95); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
    body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; color: white; }
    body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 80px; overflow-x: hidden; }
    
    /* Back to your original Top Bar */
    .top-status-bar { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--glass); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 2000; border-bottom: 2px solid var(--pink); }
    .nav-left { display: flex; flex-direction: column; gap: 4px; padding-top: 15px; }
    .nav-btn-sm { background: var(--pink); color: white; border: none; padding: 4px 8px; border-radius: 8px; font-size: 0.6rem; font-weight: bold; cursor: pointer; }
    .status-center-display { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; }
    .user-stat { display: flex; flex-direction: column; align-items: center; min-width: 80px; text-align: center; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-bottom: 2px; }
    .dot-online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .stat-label { font-size: 0.7rem; font-weight: bold; color: var(--dark); }
    .stat-time { font-size: 0.5rem; color: #777; line-height: 1.1; }

    /* Back to your original Card layout */
    .container { width: 100%; max-width: 400px; text-align: center; margin-top: 90px; }
    .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 10px; border: 1px solid #ffd1dc; color:#000; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

    /* Countdown Styling (Kept compact to fit your original look) */
    .ev-container { margin: 10px 0; max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
    .ev-bar { background: #fff0f5; border-radius: 8px; padding: 6px 10px; border-left: 3px solid var(--pink); display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
    .add-ev-link { color: var(--pink); font-size: 0.65rem; text-decoration: underline; cursor: pointer; display: block; margin-bottom: 5px; font-weight: bold; }

    /* Chat Frame */
    .chat-frame { display: none; position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 380px; height: 380px; background: var(--wa-bg); border-radius: 20px; z-index: 1500; flex-direction: column; padding: 10px; border: 2px solid var(--pink); box-shadow: 0 -5px 15px rgba(0,0,0,0.1); overflow-y: auto; gap: 8px; box-sizing: border-box; }
    .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; line-height: 1.4; color: #000; word-wrap: break-word; }
    .msg-me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
    .msg-them { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; }
</style>

<div class="container">
    <div id="login-screen" class="card">
        <h2 style="color:var(--pink);">Secret Dunia</h2>
        <input type="text" id="u-name" placeholder="User Name" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <input type="password" id="u-pass" placeholder="Enter Key" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;" onkeypress="if(event.key==='Enter') checkAuth()">
        <div style="margin:10px 0; font-size:0.8rem;"><input type="checkbox" id="private-mode"> 🕵️ Private Mode</div>
        <button style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard" style="display:none;">
        <span class="nisha-note" style="color:#d63384; font-size:0.7rem; font-style:italic;">N sb Apna Wada Yaad Rakhna Hai Hamesha.</span>
        
        <div style="margin-top:10px;">
            <span class="add-ev-link" onclick="openEventPrompt()">+ Add New Event</span>
            <div id="event-list-container" class="ev-container"></div>
        </div>

        <div class="chat-frame" id="notes-display"></div>
    </div>
</div>

<script>
    // ... [Original Logic Kept Intact] ...
    let countdownData = [];

    // Corrected Date Parser for "Invalid Date" fix
    function parseSafeDate(s) {
        if(!s) return new Date();
        let d = new Date(s.toString().replace(/-/g, '/'));
        return isNaN(d.getTime()) ? new Date() : d;
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            // ... [Original Status & Chat logic remains same] ...
            
            // Render Countdown Bars
            countdownData = data.countdowns || [];
            renderEventBars();
        } catch(e) {}
    }

    function renderEventBars() {
        const container = document.getElementById('event-list-container');
        let html = "";
        const now = Date.now();

        countdownData.forEach((ev, idx) => {
            const targetDate = new Date(ev.date.toString().replace(/-/g, '/')).getTime();
            const diff = targetDate - now;
            if (diff < -21600000) return; // Hide 6 hours after event

            html += `<div class="ev-bar">
                        <div style="text-align:left;">
                            <div style="font-weight:bold; color:var(--pink);">${ev.label}</div>
                            <div style="font-size:0.5rem; color:#999;">By: ${ev.user[0]}</div>
                        </div>
                        <div style="font-family:monospace; font-weight:bold;">${formatTimeDiff(diff)}</div>
                    </div>`;
        });
        container.innerHTML = html;
    }

    function formatTimeDiff(ms) {
        if (ms < 0) return "STARTED!";
        const d = Math.floor(ms / 86400000);
        const h = Math.floor((ms % 86400000) / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return `${d}d ${h}:${m}:${s}`;
    }

    async function openEventPrompt() {
        const label = prompt("Event Name:");
        if (!label) return;
        const dateStr = prompt("Date (YYYY/MM/DD HH:MM):", "2026/01/20 18:00");
        if (!dateStr) return;
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addCountdown", label:label, date:dateStr, user:currentUser})});
        refreshData();
    }
</script>
