<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - A4.12 (100 Msg Limit)</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.95); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
        body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 80px; overflow-x: hidden; }
        
        /* TOP BAR */
        .top-status-bar { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--glass); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 2000; border-bottom: 2px solid var(--pink); }
        .nav-left { display: flex; flex-direction: column; gap: 4px; padding-top: 15px; }
        .nav-btn-sm { background: var(--pink); color: white; border: none; padding: 4px 8px; border-radius: 8px; font-size: 0.6rem; font-weight: bold; cursor: pointer; }
        .status-center-display { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .user-stat { display: flex; flex-direction: column; align-items: center; min-width: 80px; text-align: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-bottom: 2px; }
        .dot-online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .stat-label { font-size: 0.7rem; font-weight: bold; }
        .stat-time { font-size: 0.5rem; color: #777; }

        /* CHAT FRAME */
        .chat-frame { display: none; position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 380px; height: 380px; background: var(--wa-bg); border-radius: 20px; z-index: 1500; flex-direction: column; padding: 10px; border: 2px solid var(--pink); box-shadow: 0 -5px 15px rgba(0,0,0,0.1); overflow-y: auto; gap: 8px; box-sizing: border-box; scroll-behavior: smooth; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); line-height: 1.4; color: #000; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg-them { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.6rem; opacity: 0.5; margin-top: 5px; display: block; text-align: right;}
        .tick-blue { color: #34b7f1; font-weight: bold; }
        .msg-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; font-weight: bold; display: none; border: 1px solid white; }

        /* UI ELEMENTS */
        .container { width: 100%; max-width: 400px; text-align: center; margin-top: 90px; }
        .card { background: white; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #ffd1dc; color:#000; }
        .wa-bottom { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 400px; margin: 0 auto; background: #f0f0f0; padding: 10px 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
        .wa-input-box { flex: 1; background: white; border-radius: 25px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; }
        .wa-input-box input { flex: 1; border: none; outline: none; padding: 8px 0; font-size: 0.95rem; }
        .wa-send-btn { background: #075e54; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<button onclick="toggleTheme()" style="position:fixed; top:8px; left:10px; z-index:3000; background:var(--pink); color:white; border:none; padding:5px 10px; border-radius:8px; font-size:0.65rem;">🌓 MODE</button>

<div class="top-status-bar" id="top-bar-ui" style="display:none;">
    <div class="nav-left">
        <button class="nav-btn-sm" id="silent-btn" onclick="toggleSilent()">🔕 SILENT</button>
    </div>
    <div class="status-center-display" id="top-status-content"></div>
    <div class="off-group" style="display:flex; flex-direction:column; align-items:center;">
        <button style="background:#ff4d4d; color:white; border:none; width:55px; height:35px; border-radius:8px; font-weight:bold;" onclick="fullExit()">OFF</button>
        <label style="font-size:0.5rem;"><input type="checkbox" id="stay-login"> Stay</label>
    </div>
</div>

<div class="container">
    <div id="login-screen" class="card">
        <h2 style="color:var(--pink);">Secret Dunia</h2>
        <input type="text" id="u-name" placeholder="User Name" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <input type="password" id="u-pass" placeholder="Enter Key" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;" onkeypress="if(event.key==='Enter') checkAuth()">
        <br><label style="font-size:0.8rem;"><input type="checkbox" id="private-mode"> 🕵️ Private Mode</label><br><br>
        <button style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div style="text-align: left; margin-bottom: 8px; font-style: italic; color: #d63384; font-size: 0.75rem;">N sb Apna Wada Yaad Rakhna Hai Hamesha.</div>
        <div class="card" id="event-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <b style="font-size:0.8rem; color:var(--pink);">⏳ Events</b>
                <button onclick="addNewEvent()" style="background:var(--pink); border:none; color:white; border-radius:4px; font-size:0.6rem;">+ ADD</button>
            </div>
            <div id="countdown-list"></div>
        </div>
    </div>
</div>

<div class="chat-frame" id="notes-display"></div>

<div id="wa-bar" class="wa-bottom" style="display:none;">
    <div class="wa-input-box">
        <div style="position:relative;">
            <button onclick="toggleChat()" style="background:none; border:none; font-size:1.4rem;">💬</button>
            <span id="notif-badge" class="msg-badge">0</span>
        </div>
        <input type="text" id="wa-input" placeholder="Message" onkeydown="if(event.key==='Enter') sendNote()">
    </div>
    <button class="wa-send-btn" onclick="sendNote()">➤</button>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwvU4LP-X0k2GQZuXA0wdh531QTY8gzE8djmHNRcqkt6HDrXOoxdG03UVHAhVQTULUw/exec';
    let currentUser = "", lastMsgCount = 0, isSilent = true, isPrivate = false;
    let localHistory = [], myLastSeen = 0, otherSeenCountGlobal = 0;

    function parseSafeDate(s) {
        if(!s || s === "") return new Date();
        let d = new Date(s.toString().replace(/-/g, '/').replace('T', ' '));
        return isNaN(d.getTime()) ? new Date() : d;
    }

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        isPrivate = document.getElementById('private-mode').checked;
        const res = await fetch(scriptURL);
        const data = await res.json();
        if((n.includes("AWAIS") && p == data.passwords.LoginPassAwais) || (n.includes("NISHA") && p == data.passwords.LoginPassNisha)) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            document.getElementById('wa-bar').style.display='flex';
            document.getElementById('top-bar-ui').style.display='flex';
            // Sirf last 100 messages fetch karna
            localHistory = data.history.slice(-100);
            lastMsgCount = data.history.length;
            data.onlineUsers.forEach(u => { if(u.name.toUpperCase().includes(currentUser)) myLastSeen = parseInt(u.seenCount) || 0; });
            renderMessages();
            if(!isPrivate) updateStatus("Online", myLastSeen);
            setInterval(refreshData, 5000);
        } else { alert("Wrong Key!"); }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            // Status Logic
            let topHtml = ""; 
            data.onlineUsers.forEach(u => {
                let isMe = u.name.toUpperCase().includes(currentUser);
                if(!isMe) otherSeenCountGlobal = parseInt(u.seenCount) || 0;
                let isOnline = (u.status === "Online" && (Date.now() - parseSafeDate(u.time).getTime()) < 600000);
                let nameInit = u.name.toUpperCase().includes("AWAIS") ? "A" : "N";
                topHtml += `<div class="user-stat"><div class="dot ${isOnline?'dot-online':''}"></div><span class="stat-label">${nameInit}: ${isOnline?'Online':'Offline'}</span></div>`;
            });
            document.getElementById('top-status-content').innerHTML = topHtml;

            // 100 Msg & Badge Logic
            const chatBox = document.getElementById('notes-display');
            const isChatOpen = (chatBox.style.display === 'flex');
            
            if(data.history.length > lastMsgCount) {
                localHistory = data.history.slice(-100);
                let newMsgs = data.history.length - lastMsgCount;
                lastMsgCount = data.history.length;

                if(!isChatOpen) {
                    let unread = localHistory.length - (myLastSeen % 100); 
                    let b = document.getElementById('notif-badge');
                    b.innerText = unread > 0 ? unread : 0;
                    b.style.display = unread > 0 ? 'block' : 'none';
                    if(!isSilent) document.getElementById('notif-sound').play();
                } else {
                    myLastSeen = lastMsgCount;
                    updateStatus("Online", myLastSeen);
                }
                renderMessages();
                if(isChatOpen) chatBox.scrollTop = chatBox.scrollHeight;
            }
        } catch(e) {}
    }

    function renderMessages() {
        let hHtml = "";
        localHistory.forEach((h, idx) => {
            let isMe = h.name.toUpperCase().includes(currentUser);
            // Tick calculation based on global total count
            let globalIdx = (lastMsgCount - localHistory.length) + idx;
            let tick = isMe ? (otherSeenCountGlobal > globalIdx ? '<span class="tick-blue">✓✓</span>' : '✓') : '';
            hHtml += `<div class="msg ${isMe ? "msg-me" : "msg-them"}">${h.note}<div class="msg-time">${tick}</div></div>`;
        });
        document.getElementById('notes-display').innerHTML = hHtml;
    }

    function sendNote() { 
        let inp = document.getElementById('wa-input'); let m = inp.value.trim(); if(!m) return;
        fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:m})}); 
        inp.value = "";
        setTimeout(refreshData, 500);
    }

    function toggleChat() {
        const box = document.getElementById('notes-display');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        if(box.style.display === 'flex') {
            document.getElementById('notif-badge').style.display = 'none';
            myLastSeen = lastMsgCount;
            updateStatus("Online", myLastSeen);
            box.scrollTop = box.scrollHeight;
        }
    }

    function updateStatus(s, count) { fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:isPrivate?"Private":s, seenCount:count})}); }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function toggleSilent() { isSilent = !isSilent; document.getElementById('silent-btn').innerHTML = isSilent ? "🔕 SILENT" : "🔔 SOUND"; }
    function fullExit() { updateStatus("Offline", lastMsgCount); window.location.href = "about:blank"; }
</script>
</body>
</html>
