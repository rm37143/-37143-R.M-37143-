<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - A4.13 LOCKED</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.95); --green: #2ecc71; --grey: #bdc3c7; --wa-bg: #e5ddd5; }
        body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }
        
        /* TOP BAR */
        .top-status-bar { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--glass); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 2000; border-bottom: 2px solid var(--pink); }
        .status-center-display { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; font-size: 0.7rem; font-weight: bold; color: var(--pink); }
        .user-stat { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-bottom: 2px; }
        .dot-online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .stat-time { font-size: 0.5rem; color: #777; line-height: 1.1; }

        /* UI ELEMENTS */
        .container { width: 100%; max-width: 400px; text-align: center; margin-top: 90px; }
        .card { background: white; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #ffd1dc; color:#000; }
        .wa-bottom { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 400px; margin: 0 auto; background: #f0f0f0; padding: 10px 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
        .wa-input-box { flex: 1; background: white; border-radius: 25px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; }
        .wa-input-box input { flex: 1; border: none; outline: none; padding: 8px 0; font-size: 0.95rem; }
        .wa-send-btn { background: #075e54; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .chat-frame { display: none; position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 380px; height: 380px; background: var(--wa-bg); border-radius: 20px; z-index: 1500; flex-direction: column; padding: 10px; border: 2px solid var(--pink); overflow-y: auto; gap: 8px; box-sizing: border-box; scroll-behavior: smooth; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; color: #000;}
        .msg-me { align-self: flex-end; background: #dcf8c6; }
        .msg-them { align-self: flex-start; background: #ffffff; }
        .msg-time { font-size: 0.6rem; opacity: 0.5; margin-top: 5px; text-align: right; }
        .tick-blue { color: #34b7f1; }
        .msg-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<button onclick="toggleTheme()" style="position:fixed; top:8px; left:10px; z-index:3000; background:var(--pink); color:white; border:none; padding:5px 10px; border-radius:8px; font-size:0.65rem;">🌓 MODE</button>

<div class="top-status-bar" id="top-bar-ui" style="display:none;">
    <div style="padding-top:15px;"><button class="nav-btn-sm" id="silent-btn" onclick="toggleSilent()" style="background:var(--pink); color:white; border:none; border-radius:8px; font-size:0.6rem; padding:4px 8px;">🔕 SILENT</button></div>
    <div class="status-center-display" id="top-status-content">Syncing...</div>
    <div style="display:flex; flex-direction:column; align-items:center;">
        <button style="background:#ff4d4d; color:white; border:none; width:50px; height:30px; border-radius:8px; font-weight:bold;" onclick="fullExit()">OFF</button>
        <label style="font-size:0.5rem; color: #444;"><input type="checkbox" id="stay-login"> Stay</label>
    </div>
</div>

<div class="container">
    <div id="login-screen" class="card">
        <h2 style="color:var(--pink);">Secret Dunia</h2>
        <input type="text" id="u-name" placeholder="User Name" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <input type="password" id="u-pass" placeholder="Enter Key" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <div style="margin:10px 0; font-size:0.8rem;"><input type="checkbox" id="private-mode"> 🕵️ Private Mode</div>
        <button id="login-btn" style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%; cursor:pointer;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div style="text-align: left; font-style:italic; color:#d63384; font-size:0.75rem; margin-bottom:10px;">N sb Apna Wada Yaad Rakhna Hai Hamesha.</div>
        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <b style="font-size:0.8rem; color:var(--pink);">⏳ Events</b>
                <button onclick="addNewEvent()" style="background:var(--pink); color:white; border:none; border-radius:5px; font-size:0.6rem; padding:2px 6px;">+ ADD</button>
            </div>
            <div id="countdown-list"></div>
        </div>
    </div>
</div>

<div class="chat-frame" id="notes-display"></div>

<div id="wa-bar" class="wa-bottom" style="display:none;">
    <div class="wa-input-box">
        <div style="position:relative;">
            <button onclick="toggleChat()" style="background:none; border:none; font-size:1.4rem;">💬</button>
            <span id="notif-badge" class="msg-badge">0</span>
        </div>
        <input type="text" id="wa-input" placeholder="Message" onkeydown="if(event.key==='Enter') sendNote()">
    </div>
    <button class="wa-send-btn" onclick="sendNote()">➤</button>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbykYGSw6KjnALSeOMtOPeOwTJSxkNQ3RZztsXNP8UVh_GjUew03lJI0aiysiqSJ2PJj/exec';
    let currentUser = "", lastMsgCount = 0, isSilent = true, isPrivate = false;
    let localHistory = [], myLastSeen = -1, otherSeenCountGlobal = 0;

    function parseSafeDate(s) {
        if(!s) return new Date();
        let d = new Date(s.toString().replace(/-/g, '/').replace('T', ' '));
        return isNaN(d.getTime()) ? new Date() : d;
    }

    async function checkAuth() {
        const btn = document.getElementById('login-btn');
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        if(!n || !p) return;
        
        btn.innerText = "Verifying...";
        btn.disabled = true;

        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            if((n.includes("AWAIS") && p == data.passwords.AWAIS) || (n.includes("NISHA") && p == data.passwords.NISHA)) {
                currentUser = n;
                isPrivate = document.getElementById('private-mode').checked;
                document.getElementById('login-screen').style.display='none';
                document.getElementById('dashboard').style.display='block';
                document.getElementById('wa-bar').style.display='flex';
                document.getElementById('top-bar-ui').style.display='flex';
                await refreshData();
                setInterval(refreshData, 5000);
            } else { 
                alert("Wrong Key!"); 
                btn.innerText = "Enter World";
                btn.disabled = false;
            }
        } catch(e) { 
            alert("Error connecting..."); 
            btn.innerText = "Enter World";
            btn.disabled = false;
        }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            // STATUS SYNC
            let topHtml = ""; 
            data.onlineUsers.forEach(u => {
                let isMe = u.name.toUpperCase().includes(currentUser);
                if(!isMe) otherSeenCountGlobal = parseInt(u.seenCount) || 0;
                else if(myLastSeen === -1) myLastSeen = parseInt(u.seenCount) || 0;
                let isOnline = (u.status === "Online" && (Date.now() - parseSafeDate(u.time).getTime()) < 600000);
                let nameInit = u.name.toUpperCase().includes("AWAIS") ? "A" : "N";
                topHtml += `<div class="user-stat"><div class="dot ${isOnline?'dot-online':''}"></div><span>${nameInit}: ${isOnline?'Online':'Offline'}</span></div>`;
            });
            document.getElementById('top-status-content').innerHTML = topHtml;

            // CHAT LOGIC
            if(data.history.length > lastMsgCount) {
                localHistory = data.history;
                lastMsgCount = data.history.length;
                let chatBox = document.getElementById('notes-display');
                if(chatBox.style.display !== 'flex') {
                    let unread = localHistory.length - myLastSeen;
                    if(unread > 0) {
                        let b = document.getElementById('notif-badge');
                        b.innerText = unread; b.style.display = 'block';
                        if(!isSilent) document.getElementById('notif-sound').play();
                    }
                }
                renderMessages();
            }
        } catch(e) {}
    }

    function renderMessages() {
        let hHtml = "";
        localHistory.forEach((h, idx) => {
            let isMe = h.name.toUpperCase().includes(currentUser);
            let tick = isMe ? (otherSeenCountGlobal > idx ? '<span class="tick-blue">✓✓</span>' : '✓') : '';
            hHtml += `<div class="msg ${isMe ? "msg-me" : "msg-them"}">${h.note}<div class="msg-time">${tick}</div></div>`;
        });
        document.getElementById('notes-display').innerHTML = hHtml;
    }

    function sendNote() {
        let inp = document.getElementById('wa-input'); let m = inp.value.trim(); if(!m) return;
        fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:m})});
        inp.value = ""; setTimeout(refreshData, 500);
    }

    function toggleChat() {
        let box = document.getElementById('notes-display');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        if(box.style.display === 'flex') {
            document.getElementById('notif-badge').style.display = 'none';
            myLastSeen = lastMsgCount;
            box.scrollTop = box.scrollHeight;
            fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:"Online", seenCount:myLastSeen})});
        }
    }
    
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function toggleSilent() { isSilent = !isSilent; document.getElementById('silent-btn').innerHTML = isSilent ? "🔕 SILENT" : "🔔 SOUND"; }
    function fullExit() { window.location.href = "about:blank"; }
</script>
</body>
</html>
