<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - R.M.</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.9); --green: #2ecc71; --grey: #bdc3c7; --dark: #444; }
        body.dark-mode { background: #1a1a1a; }
        .dark-mode .card { background: rgba(45, 45, 45, 0.9); border: 1px solid #444; color: white; }
        .dark-mode .status-bar { background: #333; color: #ddd; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        .container { width: 100%; max-width: 400px; text-align: center; position: relative; }
        .mode-toggle, #silent-btn { position: fixed; top: 10px; z-index: 1000; background: var(--pink); color: white; border: none; padding: 6px 10px; border-radius: 12px; font-size: 0.65rem; cursor: pointer; width: 85px; }
        .mode-toggle { left: 10px; } #silent-btn { right: 10px; }
        .main-title { color: var(--pink); margin: 35px 0 5px 0; font-size: 1.6rem; font-weight: bold; }
        .countdown-container { background: white; border-radius: 15px; padding: 12px; margin-bottom: 10px; border: 1px solid #ffd1dc; text-align: left; }
        .cd-row { margin-bottom: 10px; border-bottom: 1px solid #fff5f7; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .cd-user { font-size: 0.55rem; color: #bdc3c7; font-style: italic; display: block; }
        .del-ev-btn { background: #fff0f3; border: 1px solid #ffd1dc; color: #ff85a2; cursor: pointer; font-size: 0.8rem; padding: 2px 8px; border-radius: 8px; }
        .card { background: var(--glass); border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; border: 1px solid white; position: relative; }
        .status-bar { background: #fff; padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 0.62rem; border-left: 5px solid var(--green); text-align: left; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-online { background: var(--green); } .dot-offline { background: var(--grey); }
        .history-box { height: 320px; overflow-y: auto; text-align: left; padding: 5px; display: flex; flex-direction: column; }
        .note-item { margin-bottom: 10px; padding: 10px 15px; border-radius: 18px; max-width: 85%; font-size: 0.9rem; clear: both; }
        .note-awais { background-color: #ffe0e9; align-self: flex-end; color: #000; border-bottom-right-radius: 2px; } 
        .note-nisha { background-color: #e3f2fd; align-self: flex-start; color: #000; border-bottom-left-radius: 2px; }
        textarea { width: 85%; border: none; background: transparent; padding: 8px 5px; resize: none; outline: none; font-size: 0.95rem; }
        .btn-main { background: var(--pink); color: white; border: none; padding: 12px; border-radius: 20px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .hub-btn { background: #fff0f3; border: 1px solid #ffd1dc; padding: 10px 4px; border-radius: 12px; cursor: pointer; font-size: 0.65rem; font-weight: bold; color: #d63384; }
        #dashboard { display: none; }
        input { width: 85%; padding: 12px; margin: 8px 0; border-radius: 20px; border: 1px solid #eee; text-align: center; outline: none; }
    </style>
</head>
<body>

<button class="mode-toggle" onclick="toggleTheme()">🌓 MODE</button>
<button id="silent-btn" onclick="toggleSilent()">🔕 SILENT</button>

<div class="container">
    <h2 class="main-title">Secret Dunia</h2>
    
    <div id="login-screen" class="card">
        <input type="text" id="u-name" placeholder="User Name">
        <input type="password" id="u-pass" placeholder="Enter Key">
        <button class="btn-main" id="login-btn" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard">
        <div class="countdown-container" id="countdown-area"></div>
        <button class="btn-main" style="padding:8px; margin-bottom:10px; font-size: 0.8rem;" onclick="addCountdownPrompt()">+ Add Event</button>

        <div class="status-bar" id="status-container">Syncing...</div>
        
        <div class="card" style="display: flex; align-items: center; padding:10px;">
            <textarea id="note-input" placeholder="Write a Message..." rows="1"></textarea>
            <span onclick="sendNote()" style="cursor:pointer; font-size: 1.3rem;">🚀</span>
        </div>

        <div class="card">
            <button id="unlock-btn" class="btn-main" style="background:var(--dark);" onclick="unlockHistory()">Unlock Messages 🔒</button>
            <div id="history-area" style="display:none;">
                <div class="history-box" id="notes-display"></div>
            </div>
        </div>

        <div class="card"><div class="btn-grid" id="hub-grid"></div></div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxJJzjOnEQQB4k7lg5UxUq2Nys5Dbv3J-G56LYEKCeJmetlPJPj7Ir9_80rvKnKWWhj/exec';
    let currentUser = "", isUnlocked = false, sheetPass = {}, savedCountdowns = [];

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function toggleSilent() { let b = document.getElementById('silent-btn'); b.innerHTML = b.innerHTML.includes("🔕") ? "🔔 SOUND" : "🔕 SILENT"; }

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        const btn = document.getElementById('login-btn');
        btn.innerText = "Connecting...";
        
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            sheetPass = data.passwords;

            if((n.includes("AWAIS") && p == sheetPass.LoginPassAwais) || (n.includes("NISHA") && p == sheetPass.LoginPassNisha)) {
                currentUser = n;
                document.getElementById('login-screen').style.display='none';
                document.getElementById('dashboard').style.display='block';
                updateStatus("Online");
                setInterval(refreshData, 5000);
                setInterval(updateLiveCountdowns, 1000);
            } else { 
                alert("Wrong Password!"); 
                btn.innerText = "Enter World";
            }
        } catch(e) {
            alert("Connection Error. Check your internet or Script Deployment.");
            btn.innerText = "Enter World";
        }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            sheetPass = data.passwords;
            savedCountdowns = data.countdowns || [];
            
            let sHtml = "";
            data.onlineUsers.forEach(u => {
                let dotClass = u.status === "Online" ? "dot-online" : "dot-offline";
                sHtml += `<div class="user-row"><span><span class="dot ${dotClass}"></span><b>${u.name}</b></span><span><small>${u.time}</small></span></div>`;
            });
            document.getElementById('status-container').innerHTML = sHtml;

            if(isUnlocked) {
                let hHtml = ""; (data.history || []).forEach(h => {
                    let side = h.name.toUpperCase().includes("AWAIS") ? "note-awais" : "note-nisha";
                    hHtml += `<div class="note-item ${side}"><div>${h.note}</div><small style="font-size:0.6rem; opacity:0.7;">${h.name} • ${h.time}</small></div>`;
                });
                const display = document.getElementById('notes-display');
                display.innerHTML = hHtml;
                display.scrollTop = display.scrollHeight;
            }

            let bHtml = ""; 
            const rooms = ["Ai Assistant", "WhatsApp Hub", "Chat Room 1", "Chat Room 2", "Protected Text", "Video Room", "Pinterest", "Mega Storage"];
            rooms.forEach(name => { bHtml += `<div class="hub-btn" onclick="enterRoom('${name}')">${name}</div>`; });
            document.getElementById('hub-grid').innerHTML = bHtml;
        } catch(e) {}
    }

    function updateLiveCountdowns() {
        let html = "";
        savedCountdowns.forEach((c) => {
            let diff = new Date(c.date).getTime() - new Date().getTime();
            let timeText = "";
            if(diff > 0) {
                let d = Math.floor(diff/(1000*60*60*24));
                let h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
                let m = Math.floor((diff%(1000*60*60))/(1000*60));
                let s = Math.floor((diff%(1000*60))/1000);
                timeText = `${d}d ${h}h ${m}m ${s}s`;
            } else { timeText = "Finished!"; }
            html += `<div class="cd-row"><div><b>${c.label}</b><br><small>${timeText}</small><span class="cd-user">by ${c.user || 'Unknown'}</span></div><button class="del-ev-btn" onclick="removeEvent('${c.label}', '${c.date}', '${c.user}')">x</button></div>`;
        });
        document.getElementById('countdown-area').innerHTML = html;
    }

    async function removeEvent(label, date, creator) {
        if(creator && creator !== "Unknown" && !currentUser.includes(creator.toUpperCase())) {
            alert("Sirf " + creator + " hi ise khatam kar sakte hain!"); return;
        }
        if(confirm("Delete this event?")) {
            await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"removeCountdown", label:label, date:date})});
            setTimeout(refreshData, 1000);
        }
    }

    function updateStatus(s) { fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s})}); }
    
    async function sendNote() { 
        let input = document.getElementById('note-input');
        let m = input.value.trim(); 
        if(!m) return;
        input.value = "";
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:m})}); 
        setTimeout(refreshData, 1000);
    }

    function addCountdownPrompt() { 
        let l = prompt("Event Name:"); 
        let d = prompt("Date (YYYY-MM-DD HH:MM):", "2026-02-14 18:30"); 
        if(l && d) {
            fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addCountdown", date:d, label:l, user:currentUser})}); 
            setTimeout(refreshData, 1500);
        }
    }

    function enterRoom(r) { if(prompt("Hub Key:") == sheetPass.HubPass) alert("Feature coming soon: Redirecting to " + r); }
    function unlockHistory() { if(prompt("History Key:") == sheetPass.HistoryPass) { isUnlocked = true; document.getElementById('unlock-btn').style.display='none'; document.getElementById('history-area').style.display='block'; refreshData(); } }
</script>
</body>
</html>
