<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - DC12 A4</title>

    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.95); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
        body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 80px; overflow-x: hidden; }

        /* NICKNAME & TOP BAR */
        .nick-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .nick-btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #eee; background: white; font-size: 1.5rem; font-weight: bold; color: var(--pink); cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .nick-btn.selected { border-color: var(--pink); background: #fff0f3; transform: scale(1.1); box-shadow: 0 0 15px rgba(255, 133, 162, 0.3); }
        .top-status-bar { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--glass); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 2000; border-bottom: 2px solid var(--pink); }

        /* CHAT SYSTEM */
        .chat-frame { display: none; position: fixed; top: 75px; bottom: 65px; left: 0; right: 0; width: 100%; background: var(--wa-bg); z-index: 1500; flex-direction: column; padding: 10px; overflow-y: auto; gap: 8px; box-sizing: border-box; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); line-height: 1.4; color: #000; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg-them { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; }
        
        /* DASHBOARD & HUB */
        .hub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .hub-btn { background: var(--pink); color: white; border: none; border-radius: 8px; height: 38px; font-size: 0.65rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        /* GREEN BOARD */
        .green-board { background: #1b4d3e; border: 8px solid #5d4037; border-radius: 5px; padding: 10px; margin-top: 20px; height: 160px; overflow-y: auto; text-align: left; display: flex; flex-wrap: wrap; gap: 8px; }
        .mini-note { width: 70px; height: 75px; padding: 4px; font-size: 0.45rem; position: relative; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); border-radius: 2px; color: #333; font-family: 'Comic Sans MS', cursive; background: #fff9c4; }
        
        /* PAPER FULL VIEW */
        #paper-full-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 7000; justify-content: center; align-items: center; }
        .lined-paper { width: 85%; max-width: 350px; min-height: 500px; background: #fff; padding: 50px 25px 30px 45px; position: relative; border-radius: 2px; line-height: 28px; font-family: 'Comic Sans MS', cursive; overflow-y: auto; max-height: 80vh; }
        
        /* WA BOTTOM BAR */
        .wa-bottom { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 400px; margin: 0 auto; background: #f0f0f0; padding: 10px 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
        .wa-input-box { flex: 1; background: white; border-radius: 25px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; }
        .wa-send-btn { background: #075e54; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; }

        /* MISC */
        .msg-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; display: none; }
        .tick-blue { color: #34b7f1; }
    </style>
</head>

<body>
    <button onclick="CoreModule.toggleTheme()" style="position:fixed; top:8px; left:10px; z-index:3000; background:var(--pink); color:white; border:none; padding:5px 10px; border-radius:8px; font-size:0.65rem;">🌓 MODE</button>

    <div class="top-status-bar" id="top-bar-ui" style="display:none;">
        <div class="nav-left"><button class="nav-btn-sm" onclick="ChatModule.toggleSilent()">🔕 SILENT</button></div>
        <div class="status-center-display" id="top-status-content"></div>
        <div class="off-group"><button class="off-btn" onclick="AuthModule.fullExit()">OFF</button></div>
    </div>

    <div class="container">
        <div id="login-screen" class="card">
            <h2 style="color:var(--pink);">Secret Dunia</h2>
            <div class="nick-container">
                <button id="btn-nick-a" class="nick-btn" onclick="AuthModule.selectUser('A', 'AWAIS')">A</button>
                <button id="btn-nick-n" class="nick-btn" onclick="AuthModule.selectUser('N', 'NISHA')">N</button>
            </div>
            <input type="hidden" id="u-name">
            <input type="password" id="u-pass" placeholder="Enter Key" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
            <div style="margin:10px 0; font-size:0.8rem;"><input type="checkbox" id="private-mode">🕵️ Private Mode</div>
            <button id="login-btn" style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%;" onclick="AuthModule.checkAuth()">Enter World</button>
        </div>

        <div id="dashboard" style="display:none;">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.8rem; font-weight:bold; color:var(--pink);">⏳ Events</span>
                    <button onclick="CoreModule.addNewEvent()" style="background:var(--pink); color:white; border:none; border-radius:5px; font-size:0.6rem; padding:3px 8px;">+ ADD</button>
                </div>
                <div id="countdown-list"></div>
            </div>

            <div class="hub-grid">
                <button class="hub-btn" onclick="HubModule.open(1)">Hack.Chat</button>
                <button class="hub-btn" onclick="HubModule.open(2)">Protected</button>
                <button class="hub-btn" onclick="HubModule.open(3)">Storage</button>
                <button class="hub-btn" onclick="HubModule.open(4)">Mega</button>
                <button class="hub-btn" onclick="HubModule.open(5)">Safe</button>
                <button class="hub-btn" onclick="HubModule.open(6)">Pics</button>
                <button class="hub-btn" onclick="HubModule.open(7)">Maps</button>
                <button class="hub-btn" style="background:red;" onclick="HubModule.open(8)">🎥 REELS</button>
            </div>

            <div id="hub-quick-view" style="display:none; height:350px; position:relative; margin-top:15px; border:2px solid var(--pink);">
                <div style="position:absolute; top:5px; right:5px; z-index:100;">
                    <button onclick="HubModule.close()" style="background:red; color:white; border:none; padding:4px 8px;">X</button>
                </div>
                <iframe id="hub-iframe" style="width:100%; height:100%; border:none;"></iframe>
            </div>

            <div class="green-board" id="board-preview" onclick="BoardModule.openFull()"></div>
        </div>
    </div>

    <div class="chat-frame" id="notes-display"></div>

    <div id="wa-bar" class="wa-bottom" style="display:none;">
        <div class="wa-input-box">
            <div style="position:relative;">
                <button onclick="ChatModule.toggleChat()" style="background:none; border:none; font-size:1.4rem;">💬</button>
                <span id="notif-badge" class="msg-badge">0</span>
            </div>
            <input type="text" id="wa-input" placeholder="Message" style="border:none; outline:none; flex:1;">
        </div>
        <button class="wa-send-btn" onclick="ChatModule.send()">➤</button>
    </div>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzr4iu0iVWLZxebuZw02EWHNG6Mp5nlMOEpMeetkJ7Il3u7Skv1Iy_pvVS9JRmX-3U/exec'; // Replace with your Web App URL
        let currentUser = "", isPrivate = false, localHistory = [], lastMsgCount = 0;

        // --- AUTH MODULE ---
        const AuthModule = {
            selectUser(nick, realName) {
                document.querySelectorAll('.nick-btn').forEach(b => b.classList.remove('selected'));
                document.getElementById(nick === 'A' ? 'btn-nick-a' : 'btn-nick-n').classList.add('selected');
                document.getElementById('u-name').value = realName;
            },
            async checkAuth() {
                const n = document.getElementById('u-name').value;
                const p = document.getElementById('u-pass').value;
                if(!n) { alert("Select Name!"); return; }
                isPrivate = document.getElementById('private-mode').checked;
                
                const res = await fetch(scriptURL);
                const data = await res.json();
                
                if((n==="AWAIS" && p==data.passwords.LoginPassAwais) || (n==="NISHA" && p==data.passwords.LoginPassNisha)) {
                    currentUser = n;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('wa-bar').style.display = 'flex';
                    document.getElementById('top-bar-ui').style.display = 'flex';
                    
                    setInterval(CoreModule.refresh, 5000);
                    CoreModule.refresh();
                } else { alert("Wrong Key!"); }
            },
            fullExit() { window.location.href = "about:blank"; }
        };

        // --- CHAT MODULE ---
        const ChatModule = {
            isSilent: true,
            toggleChat() {
                const box = document.getElementById('notes-display');
                box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
            },
            toggleSilent() {
                this.isSilent = !this.isSilent;
                event.target.innerText = this.isSilent ? "🔕 SILENT" : "🔔 SOUND";
            },
            async send() {
                const input = document.getElementById('wa-input');
                const m = input.value.trim();
                if(!m) return;
                fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({name: currentUser, note: m}) });
                input.value = "";
            }
        };

        // --- CORE MODULE ---
        const CoreModule = {
            async refresh() {
                try {
                    const res = await fetch(scriptURL);
                    const data = await res.json();
                    this.renderStatus(data.onlineUsers);
                    this.renderHistory(data.history);
                    this.renderBoard(data.board);
                } catch(e) { console.log(e); }
            },
            renderStatus(users) {
                let html = "";
                users.forEach(u => {
                    let name = u.name.toUpperCase().includes("AWAIS") ? "A" : "N";
                    html += `<div class="user-stat"><span class="stat-label">${name}: ${u.status}</span></div>`;
                });
                document.getElementById('top-status-content').innerHTML = html;
            },
            renderHistory(history) {
                let h = "";
                history.forEach(m => {
                    let isMe = m.name.toUpperCase() === currentUser;
                    h += `<div class="msg ${isMe?'msg-me':'msg-them'}">${m.note}</div>`;
                });
                document.getElementById('notes-display').innerHTML = h;
            },
            renderBoard(sd) {
                let html = "";
                sd.reverse().forEach(n => {
                    html += `<div class="mini-note"><b>${n.user}:</b> ${n.content.substring(0,10)}</div>`;
                });
                document.getElementById('board-preview').innerHTML = html || "Empty";
            },
            toggleTheme() { document.body.classList.toggle('dark-mode'); }
        };

        // --- HUB MODULE ---
        const HubModule = {
            open(id) {
                const links = { 1: "https://hack.chat/?r.m.", 8: "https://www.youtube.com/embed?listType=playlist&list=PLHdfvW0-X8IunhP-S1S_u_vL0_W6S78lC" };
                const iframe = document.getElementById('hub-iframe');
                iframe.src = links[id] || "https://google.com";
                document.getElementById('hub-quick-view').style.display = 'block';
            },
            close() { document.getElementById('hub-quick-view').style.display = 'none'; }
        };

        // --- BOARD MODULE ---
        const BoardModule = {
            openFull() { alert("Board functionality module ready."); }
        };
    </script>
</body>
</html>
