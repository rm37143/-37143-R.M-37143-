<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Code001 - Final Fix</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.9); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; }
        body.dark-mode { background: #1a1a1a; }
        .dark-mode .card { background: rgba(45, 45, 45, 0.9); border: 1px solid #444; color: white; }
        .dark-mode .status-bar { background: #333; color: #ddd; }
        .dark-mode textarea { color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        .container { width: 100%; max-width: 400px; text-align: center; position: relative; }
        
        .top-nav { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 5px; z-index: 1000; }
        .nav-btn { background: var(--pink); color: white; border: none; padding: 8px 5px; border-radius: 12px; font-size: 0.55rem; font-weight: bold; cursor: pointer; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .main-title { color: var(--pink); margin: 45px 0 5px 0; font-size: 1.6rem; font-weight: bold; }
        .card { background: var(--glass); border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; border: 1px solid white; position: relative; }
        .status-bar { background: #fff; padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 0.62rem; border-left: 5px solid var(--green); text-align: left; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #f9f9f9; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-online { background: var(--green); }
        .dot-offline { background: var(--grey); }
        
        .history-box { height: 350px; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; }
        .note-item { margin-bottom: 10px; padding: 10px 14px; border-radius: 18px; max-width: 80%; position: relative; }
        .note-awais { background: #ffe0e9 !important; align-self: flex-end; border-bottom-right-radius: 2px; border-left: 3px solid var(--pink); text-align: right; } 
        .note-nisha { background: #e3f2fd !important; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #2196f3; text-align: left; }
        .note-meta { font-size: 0.52rem; color: #777; margin-top: 5px; display: block; font-weight: bold; }

        .btn-main { background: var(--pink); color: white; border: none; padding: 12px; border-radius: 20px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .hub-btn { background: #fff0f3; border: 1px solid #ffd1dc; padding: 10px 4px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; color: #d63384; }
        input, textarea { width: 92%; padding: 10px; margin: 8px 0; border-radius: 15px; border: 1px solid #eee; outline: none; }
        #dashboard { display: none; }
    </style>
</head>
<body onmousedown="resetInactivityTimer()" onkeydown="resetInactivityTimer()">

<div class="top-nav">
    <button class="nav-btn" onclick="toggleTheme()">🌓 MODE</button>
    <button class="nav-btn" id="music-btn" onclick="handleMusic()">🎵 MUSIC: OFF</button>
    <button class="nav-btn">EMPTY 3</button>
    <button class="nav-btn">EMPTY 4</button>
</div>

<audio id="music-player" loop></audio>

<div class="container">
    <h2 class="main-title">Secret Dunia</h2>
    
    <div id="login-screen" class="card">
        <input type="text" id="u-name" placeholder="User Name">
        <input type="password" id="u-pass" placeholder="Enter Key">
        <div style="font-size:0.75rem; margin-bottom:12px;">
            <input type="checkbox" id="is-private" style="width:14px;"> <span>Private Mode</span>
        </div>
        <button class="btn-main" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard">
        <div class="status-bar" id="status-container">Syncing...</div>
        <div class="card"><textarea id="note-input" placeholder="Write to Nisha..." onkeypress="if(event.key==='Enter') sendNote()"></textarea></div>
        
        <div class="card">
            <button id="unlock-btn" class="btn-main" style="background:var(--dark);" onclick="unlockHistory()">Unlock Messages 🔒</button>
            <div id="history-area" style="display:none;">
                <div class="history-box" id="notes-display"></div>
            </div>
        </div>
        <div class="card"><div class="btn-grid" id="hub-grid"></div></div>
    </div>
</div>

<script>
    // NEW UPDATED SCRIPT URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycby-EHYlQE2PKLsr6VJMZITLTf2ffKR_3jgjXa_Z2bhK9CEBbs2W3CgHLQRw3qT9EFvw/exec';
    
    // Music Playlist
    const playlist = [
        "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", // Test Song 1
        "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"  // Test Song 2
    ];
    let musicState = 0;

    function handleMusic() {
        const player = document.getElementById('music-player');
        const btn = document.getElementById('music-btn');
        musicState = (musicState + 1) % 3;

        if (musicState === 1) {
            player.src = playlist[0];
            player.play().catch(e => alert("Please tap anywhere on screen first to allow sound"));
            btn.innerText = "🎵 PLAYING";
        } else if (musicState === 2) {
            player.src = playlist[1];
            player.play();
            btn.innerText = "⏭️ NEXT SONG";
        } else {
            player.pause();
            btn.innerText = "🔇 MUSIC: OFF";
        }
    }

    let currentUser = "", isPrivateMode = false, isUnlocked = false, myLastSeen = -1;

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    function resetInactivityTimer() { 
        clearTimeout(window.inactivityTimer); 
        if(currentUser) window.inactivityTimer = setTimeout(() => { location.reload(); }, 300000); 
    }

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        isPrivateMode = document.getElementById('is-private').checked;
        if(n && (p==='37143' || p==='n37143')) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            updateStatus(isPrivateMode ? "Private Mode" : "Online", -1);
            setInterval(refreshData, 5000); refreshData();
        } else { alert("Wrong Password!"); }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            let sHtml = "";
            data.onlineUsers.forEach(u => {
                let isMe = u.name.toUpperCase().includes(currentUser);
                let statusTxt = (isMe && isPrivateMode) ? "Private Mode" : u.status;
                let dotClass = (statusTxt === "Online") ? "dot-online" : "dot-offline";
                sHtml += `<div class="user-row"><span><span class="dot ${dotClass}"></span><b>${u.name}</b>: ${statusTxt}</span><span><small>${u.time}</small></span></div>`;
            });
            document.getElementById('status-container').innerHTML = sHtml;

            if(isUnlocked) {
                let hHtml = "";
                data.history.slice().reverse().forEach(h => {
                    let c = h.name.toUpperCase().includes("AWAIS") ? "note-awais" : "note-nisha";
                    hHtml += `<div class="note-item ${c}"><div>${h.note}</div><span class="note-meta">${h.time}</span></div>`;
                });
                document.getElementById('notes-display').innerHTML = hHtml;
            }

            let bHtml = "";
            const hubButtons = [
                { name: "Ai Assistant", link: "https://gemini.google.com/app", pass: "786" },
                { name: "WhatsApp Hub", link: "https://wa.me/923059763620", pass: "786" },
                { name: "Chat Room 1", link: "https://hack.chat/?r.m.", pass: "786" },
                { name: "Chat Room 2", link: "https://hack.chat/?r.m.37143", pass: "786" },
                { name: "Protected Text", link: "https://www.protectedtext.com/r.m.", pass: "786" },
                { name: "Pinterest", link: "https://pin.it/2ltHmjbrB", pass: "786" },
                { name: "Mega Storage", link: "https://mega.nz/login", pass: "786" },
                { name: "PC Storage", link: "https://drive.google.com/drive/folders/1yHexmY0ha8D0oFJcFVRO3IXc2GgI-ZX5?usp=drive_link", pass: "786" }
            ];
            hubButtons.forEach(btn => { bHtml += `<div class="hub-btn" onclick="enterRoom('${btn.name}','${btn.link}','${btn.pass}')">${btn.name}</div>`; });
            document.getElementById('hub-grid').innerHTML = bHtml;
        } catch(e) {}
    }

    function updateStatus(s, count) {
        fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s, isPrivateMode:isPrivateMode, seenCount:count})});
    }

    async function sendNote() {
        const msg = document.getElementById('note-input').value.trim();
        if(!msg || isPrivateMode) return;
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:msg})});
        document.getElementById('note-input').value = ""; refreshData();
    }

    function enterRoom(n, l, p) {
        let pass = prompt(`Pass for ${n}:`);
        if (pass === p) {
            fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"buttonActivity", buttonName:n, state:"on"})});
            window.location.href = l;
        } else if (pass !== null) alert("Wrong!");
    }

    function unlockHistory() { isUnlocked = true; document.getElementById('unlock-btn').style.display='none'; document.getElementById('history-area').style.display='block'; refreshData(); }
</script>
</body>
</html>
