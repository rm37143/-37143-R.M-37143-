<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia A4 Pro</title>
    <style>
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.7); --green: #2ecc71; --blue: #34b7f1; }
        body { 
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; 
            padding-bottom: 90px; min-height: 100vh;
        }
        .container { width: 100%; max-width: 400px; margin: auto; text-align: center; }
        
        /* Glass Style - FIXED */
        .glass-card { 
            background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px;
            padding: 15px; margin-bottom: 12px; box-shadow: 0 8px 32px rgba(255, 133, 162, 0.15);
        }

        /* Status UI - FIXED */
        .status-box { text-align: left; font-size: 0.85rem; color: #444; }
        .status-line { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.03); }

        /* Hub Grid */
        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .hub-btn { 
            background: white; border: none; padding: 12px; border-radius: 15px;
            font-size: 0.8rem; font-weight: bold; color: #d63384; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* WhatsApp Chat UI */
        #chat-window { 
            position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 400px; height: 0; overflow: hidden;
            background: #e5ddd5; border-radius: 20px 20px 0 0; transition: height 0.4s ease;
            display: flex; flex-direction: column; z-index: 1000;
        }
        #chat-window.open { height: 70vh; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        .chat-header { background: #075e54; color: white; padding: 12px; display: flex; justify-content: space-between; font-weight: bold; }
        #notes-display { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }

        /* Message Bubbles */
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.9rem; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg-me { align-self: flex-end; background: #dcf8c6; }
        .msg-them { align-self: flex-start; background: #fff; }
        .tick-blue { color: var(--blue); }

        /* Bottom Bar - FIXED */
        .bottom-bar { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 400px; background: #f0f0f0; padding: 10px;
            display: flex; align-items: center; gap: 10px; z-index: 1001;
        }
        .input-wrap { flex: 1; background: white; border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; gap: 10px; }
        .chat-input { flex: 1; border: none; outline: none; padding: 10px 0; font-size: 1rem; }
        .btn-send { background: #075e54; color: white; width: 45px; height: 45px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:var(--pink); margin-top: 30px;">Secret Dunia</h2>

    <div id="login-screen" class="glass-card">
        <input type="text" id="u-name" placeholder="Name" style="width:80%; padding:10px; margin:5px; border-radius:10px; border:1px solid #ddd;">
        <input type="password" id="u-pass" placeholder="Key" style="width:80%; padding:10px; margin:5px; border-radius:10px; border:1px solid #ddd;">
        <button onclick="checkAuth()" style="width:85%; background:var(--pink); color:white; border:none; padding:12px; border-radius:25px; font-weight:bold; margin-top:10px;">Enter</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="glass-card status-box" id="status-area">Syncing...</div>

        <div class="glass-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <b>🎵 Secret Playlist</b>
                <button onclick="addSong()" style="font-size:0.6rem; background:var(--blue); color:white; border:none; padding:3px 8px; border-radius:5px;">+ Add</button>
            </div>
            <div id="playlist-list" style="text-align:left; margin-top:8px;"></div>
        </div>

        <div id="countdown-area"></div>
        <button onclick="addEvent()" style="background:var(--pink); color:white; border:none; padding:10px 20px; border-radius:20px; font-weight:bold; font-size:0.8rem; margin-bottom:15px;">+ New Event</button>

        <div class="hub-grid" id="hub-grid"></div>

        <div id="chat-window">
            <div class="chat-header"><span id="chat-partner">Chat</span><span onclick="toggleChat()" style="cursor:pointer">✕</span></div>
            <div id="notes-display"></div>
        </div>

        <div class="bottom-bar">
            <div class="input-wrap">
                <span style="cursor:pointer; font-size:1.5rem;" onclick="toggleChat()">💬</span>
                <label for="f-in" style="cursor:pointer; font-size:1.5rem;">📎</label>
                <input type="file" id="f-in" hidden onchange="uploadFile(this)">
                <input type="text" id="note-input" class="chat-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendNote()">
            </div>
            <button class="btn-send" onclick="sendNote()">➤</button>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbywOjby5ya8plMFzC8v6TI3Yxpz_pXt-bZYEZPYUh_9Dz860qFufGR-lcMkwNzK1tJH/exec';
    let currentUser = "", savedHistory = [], isChatOpen = false, allPass = {};

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        const res = await fetch(scriptURL);
        const data = await res.json();
        allPass = data.passwords;
        if((n.includes("AWAIS") && p == allPass.LoginPassAwais) || (n.includes("NISHA") && p == allPass.LoginPassNisha)) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            updateStatus("Online", -1);
            setInterval(refresh, 4000);
            renderHub();
        } else { alert("Wrong Key!"); }
    }

    function renderHub() {
        const btns = [
            {n:"Ai Assistant", p:"AiPass"}, {n:"WhatsApp Hub", p:"HubPass"}, 
            {n:"Chat Rooms", p:"HistoryPass"}, {n:"Pinterest", p:"HubPass"},
            {n:"Video Room", p:"HubPass"}, {n:"Mega Drive", p:"HubPass"},
            {n:"Protected Text", p:"HistoryPass"}, {n:"Settings", p:"LoginPassAwais"}
        ];
        let h = ""; btns.forEach(b => h += `<div class="hub-btn" onclick="openHub('${b.n}', '${b.p}')">${b.n}</div>`);
        document.getElementById('hub-grid').innerHTML = h;
    }

    function openHub(n, pk) {
        let p = prompt("Enter Key for " + n);
        if(p == allPass[pk] || p == allPass["LoginPassAwais"]) alert("Opening " + n);
        else alert("Wrong!");
    }

    function toggleChat() {
        isChatOpen = !isChatOpen;
        document.getElementById('chat-window').classList.toggle('open', isChatOpen);
        if(isChatOpen) { 
            setTimeout(() => { document.getElementById('notes-display').scrollTop = document.getElementById('notes-display').scrollHeight; }, 300);
            updateStatus("Online", savedHistory.length); 
        }
    }

    async function sendNote() {
        const input = document.getElementById('note-input');
        const m = input.value.trim(); if(!m) return;
        renderMessage({name:currentUser, note:m, time:new Date(), isTemp:true}, true);
        input.value = "";
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:m})});
    }

    function renderMessage(h, append = false) {
        const display = document.getElementById('notes-display');
        const isMe = h.name.toUpperCase().includes(currentUser);
        let note = h.note;
        if(note.startsWith("MEDIA:")) note = `<img src="${note.split(':')[1]}" style="width:100%; border-radius:10px;">`;
        
        const html = `<div class="msg ${isMe ? 'msg-me' : 'msg-them'}"><div>${note}</div><div style="font-size:0.6rem; text-align:right;">${new Date(h.time).getHours()}:${new Date(h.time).getMinutes()} ${isMe ? (h.isTemp?'✓':'✓✓') : ''}</div></div>`;
        display.insertAdjacentHTML('beforeend', html);
        if(append) display.scrollTop = display.scrollHeight;
    }

    async function refresh() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            let sHtml = ""; let partnerSeen = 0;
            data.onlineUsers.forEach(u => {
                if(!u.name.toUpperCase().includes(currentUser)) { partnerSeen = u.seenCount; document.getElementById('chat-partner').innerText = u.name; }
                sHtml += `<div class="status-line"><b>${u.name}</b> <span>${u.status}</span></div>`;
            });
            document.getElementById('status-area').innerHTML = sHtml;

            if(data.history.length !== savedHistory.length) {
                const display = document.getElementById('notes-display');
                display.innerHTML = "";
                savedHistory = data.history;
                data.history.forEach((h, idx) => {
                    renderMessage(h);
                    if(idx + 1 <= partnerSeen) {
                        const ticks = display.querySelectorAll('.tick');
                        if(ticks[idx]) ticks[idx].style.color = "var(--blue)";
                    }
                });
                if(isChatOpen) display.scrollTop = display.scrollHeight;
            }
            renderPlaylist(data.playlist);
            renderEvents(data.countdowns);
        } catch(e) {}
    }

    function renderPlaylist(l) {
        let h = ""; (l || []).forEach(s => h += `<div style="font-size:0.75rem; padding:4px 0; border-bottom:1px solid rgba(0,0,0,0.03);">▶ ${s.title}</div>`);
        document.getElementById('playlist-list').innerHTML = h;
    }

    function renderEvents(l) {
        let h = ""; (l || []).forEach(e => {
            const diff = Math.floor((new Date(e.date) - new Date())/(1000*60*60*24));
            h += `<div class="glass-card" style="text-align:left; font-size:0.8rem;"><b>${e.label}</b>: ${diff > 0 ? diff+' days' : 'Finished'}</div>`;
        });
        document.getElementById('countdown-area').innerHTML = h;
    }

    async function uploadFile(i) {
        const f = i.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const b64 = e.target.result.split(',')[1];
            await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"uploadMedia", name:currentUser, type:f.type, base64:b64})});
            refresh();
        };
        reader.readAsDataURL(f);
    }

    function updateStatus(s, c) { fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"updateStatus", name:currentUser, status:s, seenCount:c})}); }
    function addSong() { let t = prompt("Song:"); let u = prompt("URL:"); if(t && u) fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addSong", title:t, url:u, user:currentUser})}); }
    function addEvent() { let l = prompt("Event:"); let d = prompt("Date:"); if(l && d) fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addCountdown", date:d, label:l, user:currentUser})}); }
</script>
</body>
</html>
