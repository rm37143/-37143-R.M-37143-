<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Dunia - A4.9 LOCKED</title>
    
    <style>
        /* --- ORIGINAL A4 STYLES (UNCHANGED) --- */
        :root { --pink: #ff85a2; --glass: rgba(255, 255, 255, 0.95); --green: #2ecc71; --grey: #bdc3c7; --blue: #a2d2ff; --dark: #444; --wa-bg: #e5ddd5; }
        body.dark-mode { background: #1a1a1a; --wa-bg: #0b141a; color: white; }
        body { background: #fce4ec; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; padding-bottom: 80px; overflow-x: hidden; }
        
        .top-status-bar { position: fixed; top: 0; left: 0; right: 0; height: 75px; background: var(--glass); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 2000; border-bottom: 2px solid var(--pink); }
        .nav-left { display: flex; flex-direction: column; gap: 4px; padding-top: 15px; }
        .nav-btn-sm { background: var(--pink); color: white; border: none; padding: 4px 8px; border-radius: 8px; font-size: 0.6rem; font-weight: bold; cursor: pointer; }
        .status-center-display { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .user-stat { display: flex; flex-direction: column; align-items: center; min-width: 80px; text-align: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-bottom: 2px; }
        .dot-online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .stat-label { font-size: 0.7rem; font-weight: bold; color: var(--dark); }
        .off-btn { background: #ff4d4d; color: white; border: none; width: 55px; height: 35px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .chat-frame { display: none; position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 380px; height: 380px; background: var(--wa-bg); border-radius: 20px; z-index: 1500; flex-direction: column; padding: 10px; border: 2px solid var(--pink); box-shadow: 0 -5px 15px rgba(0,0,0,0.1); overflow-y: auto; gap: 8px; box-sizing: border-box; scroll-behavior: smooth; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 0.85rem; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); line-height: 1.4; color: #000; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg-them { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.6rem; opacity: 0.5; margin-top: 5px; display: block; text-align: right;}
        .msg-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; font-weight: bold; display: none; border: 1px solid white; min-width: 12px; }
        
        .container { width: 100%; max-width: 400px; text-align: center; margin-top: 90px; }
        .card { background: white; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #ffd1dc; color:#000; }
        .wa-bottom { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 400px; margin: 0 auto; background: #f0f0f0; padding: 10px 8px; display: flex; align-items: center; gap: 8px; z-index: 2000; border-top: 1px solid #ddd; }
        .wa-input-box { flex: 1; background: white; border-radius: 25px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; }
        .wa-input-box input { flex: 1; border: none; outline: none; padding: 8px 0; font-size: 0.95rem; }
        .wa-send-btn { background: #075e54; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; }

        /* --- BOARD ENHANCED UI (ONLY FIXES) --- */
        .board-full-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:4000; flex-direction:column; padding:15px; box-sizing:border-box; }
        .chalk-container { background:#1b4d3e; border:6px solid #5d4037; flex:1; border-radius:10px; padding:15px; overflow-y:auto; margin-bottom:15px; box-shadow: inset 0 0 30px #000; text-align: left; }
        .chalk-text { font-family: 'Comic Sans MS', cursive; color: #fff; margin-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom:10px; }
        .type-HEAD { font-size: 1.3rem; font-weight: bold; color: #ffeb3b !important; border-bottom: 2px solid #ffeb3b; display: block; margin-top: 10px; }
        .type-Q { color: #a2d2ff !important; font-style: italic; }
        .type-NEW { color: #2ecc71 !important; border-left: 3px solid #2ecc71; padding-left: 10px; }
        .board-controls { display: flex; flex-direction: column; gap: 10px; background: #222; padding: 12px; border-radius: 12px; }
        .control-row { display: flex; gap: 8px; }
        .save-btn-large { background:var(--green); color:white; border:none; padding:15px; border-radius:8px; font-weight:bold; width:100%; font-size:1rem; cursor: pointer; }
        .green-board { background: #1b4d3e; border: 6px solid #5d4037; border-radius: 5px; padding: 15px; margin-top: 20px; min-height: 80px; cursor: pointer; color: white; font-family: 'Comic Sans MS', cursive; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<button onclick="toggleTheme()" style="position:fixed; top:8px; left:10px; z-index:3000; background:var(--pink); color:white; border:none; padding:5px 10px; border-radius:8px; font-size:0.65rem;">🌓 MODE</button>

<div class="top-status-bar" id="top-bar-ui" style="display:none;">
    <div class="nav-left">
        <button class="nav-btn-sm" id="silent-btn" onclick="toggleSilent()">🔕 SILENT</button>
    </div>
    <div class="status-center-display" id="top-status-content"></div>
    <div class="off-group">
        <button class="off-btn" onclick="fullExit()">OFF</button>
        <label style="font-size:0.5rem;"><input type="checkbox" id="stay-login"> Stay</label>
    </div>
</div>

<div class="container">
    <div id="login-screen" class="card">
        <h2 style="color:var(--pink);">Secret Dunia</h2>
        <input type="text" id="u-name" placeholder="User Name" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <input type="password" id="u-pass" placeholder="Enter Key" style="width:85%; padding:12px; margin:8px 0; border-radius:20px; border:1px solid #eee; text-align:center;">
        <div style="margin:10px 0; font-size:0.8rem;"><input type="checkbox" id="private-mode"> 🕵️ Private Mode</div>
        <button style="background:var(--pink); color:white; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%;" onclick="checkAuth()">Enter World</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div style="text-align: left; margin-bottom: 8px;">
            <span style="color:#d63384; font-size:0.75rem; font-weight: bold; font-style:italic;">N sb Apna Wada Yaad Rakhna Hai Hamesha.</span>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 0.8rem; font-weight: bold; color: var(--pink);">⏳ Events</span>
                <button onclick="addNewEvent()" style="background:var(--pink); color:white; border:none; border-radius:5px; font-size:0.6rem; padding:3px 8px;">+ ADD</button>
            </div>
            <div id="countdown-list"></div>
        </div>

        <div class="hub-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px;">
            <button style="height:45px; border-radius:10px; border:1.5px solid var(--pink); background:white;" onclick="openHub(1)">🔗</button>
            <button style="height:45px; border-radius:10px; border:1.5px solid var(--pink); background:white;" onclick="openHub(2)">🎬</button>
            <button style="height:45px; border-radius:10px; border:1.5px solid var(--pink); background:white;" onclick="openHub(3)">🎧</button>
            <button style="height:45px; border-radius:10px; border:1.5px solid var(--pink); background:white;" onclick="openHub(4)">📂</button>
        </div>

        <div class="green-board" onclick="openFullBoard()">
            <div id="board-preview">Click to open Chalk Board...</div>
        </div>
    </div>
</div>

<div id="board-modal" class="board-full-view">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="color:white; margin:0;">🖍️ Chalk Board</h3>
        <button onclick="closeFullBoard()" style="background:#ff4d4d; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold;">CLOSE</button>
    </div>
    <div class="chalk-container" id="board-full-content"></div>
    <div class="board-controls">
        <div class="control-row">
            <select id="board-type" style="width:110px; padding:10px; border-radius:5px;">
                <option value="NOTE">Note</option>
                <option value="Q">Question</option>
                <option value="A">Answer</option>
                <option value="HEAD">Heading</option>
                <option value="NEW">Free Write</option>
            </select>
            <input type="text" id="board-input" placeholder="Board par likhein..." style="flex:1; padding:10px; border-radius:5px; border:none;">
        </div>
        <button onclick="saveToBoard()" id="board-save-btn" class="save-btn-large">SAVE ON BOARD</button>
    </div>
</div>

<div class="chat-frame" id="notes-display"></div>

<div id="wa-bar" class="wa-bottom" style="display:none;">
    <div class="wa-input-box">
        <div style="position:relative;">
            <button onclick="toggleChat()" style="background:none; border:none; font-size:1.4rem;">💬</button>
            <span id="notif-badge" class="msg-badge">0</span>
        </div>
        <input type="text" id="wa-input" placeholder="Message" onkeydown="if(event.key==='Enter') sendNote()">
    </div>
    <button class="wa-send-btn" onclick="sendNote()">➤</button>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwqpDqEustc3ZeT9wq_A0mHIAudf-5AIoMcG9bSFHX3UArRdpNBKglxtUNRqZc_HLav/exec';
    let currentUser = "", lastMsgCount = 0, isSilent = true, isPrivate = false, localHistory = [];

    async function checkAuth() {
        const n = document.getElementById('u-name').value.toUpperCase().trim();
        const p = document.getElementById('u-pass').value.trim();
        isPrivate = document.getElementById('private-mode').checked;
        const res = await fetch(scriptURL);
        const data = await res.json();
        if((n.includes("AWAIS") && p == data.passwords.LoginPassAwais) || (n.includes("NISHA") && p == data.passwords.LoginPassNisha)) {
            currentUser = n;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            document.getElementById('wa-bar').style.display='flex';
            document.getElementById('top-bar-ui').style.display='flex';
            refreshData();
            setInterval(refreshData, 5000);
        } else { alert("Wrong Key!"); }
    }

    async function refreshData() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            renderBoard(data.board);
            if(data.history.length > lastMsgCount) {
                localHistory = data.history;
                renderMessages();
                lastMsgCount = data.history.length;
            }
        } catch(e) { console.log(e); }
    }

    function renderBoard(boardData) {
        if(!boardData) return;
        const full = document.getElementById('board-full-content');
        let html = "";
        boardData.forEach(item => {
            let cssClass = "type-" + item.type;
            html += `<div class="chalk-text ${cssClass}">${item.content}<br><small style="font-size:0.6rem; opacity:0.6;">— ${item.user} (${item.time})</small></div>`;
        });
        full.innerHTML = html;
        document.getElementById('board-preview').innerText = "Board Updated! Tap to open.";
    }

    async function saveToBoard() {
        const type = document.getElementById('board-type').value;
        const content = document.getElementById('board-input').value.trim();
        if(!content) return;
        document.getElementById('board-save-btn').innerText = "WRITING...";
        await fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"addBoard", type:type, content:content, user:currentUser})});
        document.getElementById('board-input').value = "";
        document.getElementById('board-save-btn').innerText = "SAVE ON BOARD";
        refreshData();
    }

    function renderMessages() {
        let hHtml = "";
        localHistory.forEach(h => {
            let isMe = h.name.toUpperCase().includes(currentUser);
            hHtml += `<div class="msg ${isMe ? "msg-me" : "msg-them"}">${h.note}</div>`;
        });
        document.getElementById('notes-display').innerHTML = hHtml;
    }

    function sendNote() {
        let m = document.getElementById('wa-input').value.trim();
        if(!m) return;
        fetch(scriptURL, {method:'POST', mode:'no-cors', body:JSON.stringify({name:currentUser, note:m})});
        document.getElementById('wa-input').value = "";
        refreshData();
    }

    function openFullBoard() { document.getElementById('board-modal').style.display = 'flex'; }
    function closeFullBoard() { document.getElementById('board-modal').style.display = 'none'; }
    function toggleChat() { 
        const box = document.getElementById('notes-display');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
    }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
</script>
</body>
</html>
